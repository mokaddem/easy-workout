<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Réglages : données et sauvegarde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<link rel="stylesheet" href="../../src/ui/tokens.css">
<style>
/* ---------- mockup shell (outside the phone) ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font-sans);
  font-stretch: var(--font-width-text);
  font-size: var(--type-body-size);
  line-height: var(--type-body-line);
  color: var(--color-text);
  background: color-mix(in srgb, var(--color-bg) 88%, var(--color-text));
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, p, ul, ol, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
svg.i { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i--sm { width: 20px; height: 20px; }
svg.i--lg { width: 28px; height: 28px; }
svg.i--fill { fill: currentColor; stroke: none; }

.mock-bar {
  position: sticky; top: 0; z-index: 100;
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
  padding: 12px 24px;
  background: color-mix(in srgb, var(--color-bg) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--color-line);
  font-size: 14px;
}
.mock-bar__title { font-weight: 700; font-stretch: var(--font-width-title); font-size: 18px; margin-right: auto; }
.mock-toggle { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--radius-pill); background: var(--color-surface-sunken); }
.mock-toggle button { min-height: 32px; padding: 0 14px; border-radius: var(--radius-pill); font-weight: 600; font-size: 14px; color: var(--color-text-muted); }
.mock-toggle button[aria-pressed="true"] { background: var(--color-surface-inverse); color: var(--color-on-inverse); }
.mock-toggle button:focus-visible { outline: none; box-shadow: var(--focus-ring); }

.mock-stage { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 40px; padding: 32px 24px 64px; }
.mock-shot { display: flex; flex-direction: column; gap: 14px; align-items: center; }
.mock-shot figcaption { font-size: 15px; font-weight: 600; color: var(--color-text-muted); }

/* ---------- the phone: 390 × 844 ---------- */
.device {
  position: relative; width: 390px; height: 844px; flex: none;
  display: flex; flex-direction: column;
  border-radius: 48px; overflow: hidden; isolation: isolate;
  background: var(--color-bg); color: var(--color-text);
  box-shadow: 0 0 0 1px var(--color-line), 0 24px 80px rgb(0 0 0 / 0.28);
}
@media (max-width: 440px) {
  .mock-stage { padding: 16px 0 48px; gap: 32px; }
  .mock-bar { padding: 10px 16px; }
  .device { border-radius: 0; box-shadow: none; }
}
.statusbar { height: 47px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 4px 30px 0 40px; font-size: 16px; font-weight: 600; font-stretch: 100%; letter-spacing: 0.01em; }
.statusbar__icons { display: flex; gap: 6px; align-items: center; }
.statusbar__icons svg { height: 12px; fill: currentColor; }
.homebar { position: absolute; z-index: 60; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: currentColor; opacity: 0.85; pointer-events: none; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }

/* ---------- type roles ---------- */
.num { font-stretch: var(--type-numeral-width); font-weight: var(--type-numeral-weight); font-variant-numeric: tabular-nums lining-nums; letter-spacing: var(--type-numeral-tracking); line-height: var(--type-numeral-line); }
.t-display { font-size: var(--type-display-size); line-height: var(--type-display-line); font-weight: var(--type-display-weight); font-stretch: var(--type-display-width); letter-spacing: var(--letter-spacing-display); }
.t-exercise { font-size: var(--type-exercise-size); line-height: var(--type-exercise-line); font-weight: var(--type-exercise-weight); font-stretch: var(--type-exercise-width); letter-spacing: var(--letter-spacing-display); text-wrap: balance; }
.t-title { font-size: var(--type-title-size); line-height: var(--type-title-line); font-weight: var(--type-title-weight); font-stretch: var(--type-title-width); }
.t-headline { font-size: var(--type-headline-size); line-height: var(--type-title-line); font-weight: var(--type-title-weight); font-stretch: var(--type-title-width); }
.t-body { font-size: var(--type-body-size); line-height: var(--type-body-line); }
.t-body-lg { font-size: var(--type-body-size-lg); line-height: 1.45; }
.t-meta { font-size: var(--type-meta-size); line-height: 1.4; }
.t-label { font-size: var(--type-label-size); line-height: var(--type-label-line); font-weight: var(--type-label-weight); font-stretch: var(--type-label-width); }
.muted { color: var(--color-text-muted); }
.subtle { color: var(--color-text-subtle); }

/* ---------- buttons ---------- */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: var(--tap-comfort); padding: 0 var(--space-6);
  border-radius: var(--radius-md); border: var(--border-control) solid transparent;
  font-size: var(--type-label-size); line-height: var(--type-label-line); font-weight: var(--type-label-weight); font-stretch: var(--type-label-width);
  transition: transform var(--duration-instant) var(--ease-snap), background-color var(--duration-fast) var(--ease-move);
}
.btn:active { transform: scale(var(--motion-scale-press)); }
.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.btn--primary { background: var(--color-accent); color: var(--color-on-accent); }
.btn--primary:active { background: var(--color-accent-pressed); }
.btn--secondary { border-color: var(--color-line-strong); color: var(--color-text); }
.btn--secondary:active { background: var(--color-press-overlay); }
.btn--ghost { color: var(--color-text); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; padding: 0 var(--space-3); }
.btn--destructive { background: var(--color-danger); color: var(--color-on-danger); }
.btn--destructive-outline { border-color: var(--color-danger-text); color: var(--color-danger-text); }
.btn--block { width: 100%; }
.btn--player { min-height: var(--tap-player); font-size: var(--font-size-21); }
.btn[disabled] { background: var(--color-surface-sunken); color: var(--color-text-disabled); border-color: transparent; cursor: default; }

.icon-btn { display: inline-grid; place-items: center; width: var(--tap-min); height: var(--tap-min); border-radius: var(--radius-md); color: var(--color-text); flex: none; }
.icon-btn:active { background: var(--color-press-overlay); }
.icon-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.icon-btn--filled { background: var(--color-surface-sunken); }
.icon-btn--player { width: var(--tap-player); height: var(--tap-player); }

/* ---------- stepper ---------- */
.stepper { display: inline-flex; align-items: center; border-radius: var(--radius-md); background: var(--color-surface-sunken); flex: none; }
.stepper__btn { width: var(--tap-min); height: var(--tap-min); display: grid; place-items: center; border-radius: var(--radius-md); color: var(--color-text); }
.stepper__btn:active { background: var(--color-press-overlay); }
.stepper__btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.stepper__btn[disabled] { color: var(--color-text-disabled); }
.stepper__value { min-width: 84px; display: inline-flex; align-items: baseline; justify-content: center; gap: 3px; padding: 0 2px; }
.stepper__value .num { font-size: var(--type-numeral-s-size); line-height: 1; }
.stepper__unit { font-size: 14px; font-weight: 600; color: var(--color-text-muted); }
.stepper--player .stepper__btn { width: var(--tap-player); height: var(--tap-player); }
.stepper--player .stepper__value { min-width: 96px; }
.stepper--player .stepper__value .num { font-size: var(--type-numeral-m-size); }

/* ---------- segmented control ---------- */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: var(--radius-md); background: var(--color-surface-sunken); }
.seg__opt { min-height: var(--tap-min); border-radius: 10px; font-weight: 700; font-stretch: var(--font-width-label); font-size: var(--type-label-size-sm); color: var(--color-text-muted); transition: background-color var(--duration-fast) var(--ease-move), color var(--duration-fast) var(--ease-move); }
.seg__opt[aria-checked="true"] { background: var(--color-surface-inverse); color: var(--color-on-inverse); }
.seg__opt:focus-visible { outline: none; box-shadow: var(--focus-ring); }

/* ---------- chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: var(--tap-min); padding: 0 16px; border-radius: var(--radius-pill); border: var(--border-control) solid var(--color-line-strong); font-weight: 600; font-size: 15px; font-stretch: var(--font-width-label); }
.chip .i { width: 18px; height: 18px; stroke-width: 2.5; }
.chip[aria-pressed="true"] { background: var(--color-surface-inverse); border-color: var(--color-surface-inverse); color: var(--color-on-inverse); }
.chip[aria-pressed="false"] .i { display: none; }
.chip--static { min-height: 32px; padding: 0; border: 0; border-radius: 0; color: var(--color-text); cursor: default; }
.chip--static .i { color: var(--color-text-muted); }
.chip:focus-visible { outline: none; box-shadow: var(--focus-ring); }

/* ---------- cards, rows ---------- */
.card { background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--elevation-1); border: var(--border-hairline) solid var(--color-line); }

/* ---------- checkbox mark ---------- */
.check { width: 28px; height: 28px; border-radius: var(--radius-sm); display: grid; place-items: center; border: var(--border-strong) solid var(--color-line-strong); flex: none; transition: background-color var(--duration-fast) var(--ease-move); }
.check .i { width: 18px; height: 18px; stroke-width: 3; opacity: 0; }
.is-on .check { background: var(--color-surface-inverse); border-color: var(--color-surface-inverse); color: var(--color-on-inverse); }
.is-on .check .i { opacity: 1; }

/* ---------- progress ---------- */
.bar { height: 8px; border-radius: var(--radius-xs); background: var(--color-track); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--color-accent-line); border-radius: inherit; }
.segs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.segs > i { height: 6px; border-radius: var(--radius-xs); background: var(--color-track); }
.segs > i.done { background: var(--color-text-subtle); }
.segs > i.cur { background: var(--color-accent-line); }

/* ---------- toast ---------- */
.toast { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 4px 4px 4px 20px; border-radius: var(--radius-pill); background: var(--color-surface-inverse); color: var(--color-on-inverse); box-shadow: var(--elevation-3); font-weight: 600; font-size: 15px; }
.toast__text { flex: 1; line-height: 1.3; }
.toast .btn { min-height: var(--tap-min); color: var(--color-on-inverse); border-radius: var(--radius-pill); }

/* ---------- animation slot placeholder ---------- */
.anim-slot {
  position: relative; overflow: hidden; border-radius: var(--radius-lg);
  background:
    radial-gradient(120% 90% at 50% 38%, var(--color-surface-raised) 0%, var(--color-surface) 62%);
  border: var(--border-hairline) solid var(--color-line);
  color: var(--color-text-subtle);
}
.anim-slot__floor { position: absolute; inset: auto 0 0 0; width: 100%; height: 46%; stroke: var(--color-line); stroke-width: 1; fill: none; }
svg.anim-slot__glyph { position: absolute; left: 50%; top: 40%; width: 76px; height: 76px; margin: -38px 0 0 -38px; stroke-width: 1.4; color: var(--color-text-subtle); opacity: 0.9; }
.anim-slot__tag { position: absolute; top: 12px; left: 12px; padding: 4px 10px; border-radius: var(--radius-pill); background: var(--color-bg); color: var(--color-text-muted); font-size: 13px; font-weight: 600; font-stretch: var(--font-width-label); }
.anim-slot__cue { position: absolute; left: 16px; right: 16px; bottom: 14px; text-align: center; color: var(--color-text-muted); font-weight: 600; font-size: 15px; line-height: 1.3; text-wrap: balance; }

/* ---------- tempo indicator ---------- */
.tempo { display: grid; gap: 4px; }
.tempo__seg { position: relative; overflow: hidden; display: grid; align-content: center; gap: 2px; min-height: 52px; padding: 0 10px; border-radius: var(--radius-xs); background: var(--color-surface-sunken); color: var(--color-text-muted); font-weight: 700; font-stretch: var(--font-width-label); font-size: 13px; line-height: 1.1; white-space: nowrap; }
.tempo__seg b { font-size: var(--font-size-21); font-weight: 800; font-stretch: var(--font-width-title); line-height: 1; color: var(--color-text); font-variant-numeric: tabular-nums; }
.tempo__seg.is-active { background: var(--color-accent); color: var(--color-on-accent); }
.tempo__seg.is-active b { color: var(--color-on-accent); }
.tempo__seg > span, .tempo__seg > b { position: relative; }


/* ================================================================
   Setup screens: shared pieces
   ================================================================ */
.statusbar { color: var(--color-text); }

a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }

/* ---------- app bars ---------- */
.appbar { display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 4px 16px 4px 8px; flex: none; }
.appbar--root { padding: 4px 12px 4px var(--layout-gutter); }
.appbar__title { flex: 1; min-width: 0; font-size: var(--font-size-21); }
.steps { flex: 1; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
.steps--solo { padding-left: 12px; }
.steps__label { font-weight: 600; color: var(--color-text-muted); }

/* ---------- screen intro ---------- */
.intro { padding: 12px var(--layout-gutter) 24px; display: grid; gap: 10px; }
.intro .t-display { font-size: var(--font-size-48); text-wrap: balance; }
.intro--tight { padding-bottom: 16px; }

/* ---------- section headings inside a scroll ---------- */
.group { padding: 0 16px; display: grid; gap: 12px; }
.group + .group { margin-top: 32px; }
.group__head { padding: 0 4px; display: grid; gap: 2px; }
.group__head .t-meta { color: var(--color-text-muted); }

/* ---------- choice card (single choice: goal, level) ---------- */
.choices { display: grid; gap: 10px; padding: 0 16px; }
.choice {
  position: relative; width: 100%; display: flex; align-items: center; gap: 14px;
  min-height: 76px; padding: 16px 16px 16px 16px; text-align: left;
  border-radius: var(--radius-lg); background: var(--color-surface);
  border: var(--border-control) solid var(--color-line-strong); box-shadow: var(--elevation-1);
  transition: background-color var(--duration-fast) var(--ease-move), color var(--duration-fast) var(--ease-move), transform var(--duration-instant) var(--ease-snap);
}
.choice:active { transform: scale(var(--motion-scale-press)); }
.choice:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.choice__radio { width: 28px; height: 28px; flex: none; border-radius: var(--radius-pill); border: var(--border-strong) solid var(--color-line-strong); display: grid; place-items: center; }
.choice__radio .i { width: 18px; height: 18px; stroke-width: 3; opacity: 0; }
.choice__text { flex: 1; min-width: 0; display: grid; gap: 4px; }
.choice__title { font-size: var(--font-size-21); }
.choice__desc { font-size: 15px; line-height: 1.4; color: var(--color-text-muted); }
.choice__fig { flex: none; display: grid; justify-items: end; gap: 4px; min-width: 64px; text-align: right; }
.choice__fig .num { font-size: var(--font-size-36); }
.choice__fig small { font-size: 13px; font-weight: 600; font-stretch: var(--font-width-label); color: var(--color-text-muted); line-height: 1.15; }
.choice[aria-checked="true"] { background: var(--color-surface-inverse); color: var(--color-on-inverse); border-color: var(--color-surface-inverse); }
.choice[aria-checked="true"] .choice__desc,
.choice[aria-checked="true"] .choice__fig small { color: var(--color-on-inverse); opacity: 0.78; }
.choice[aria-checked="true"] .choice__radio { border-color: var(--color-on-inverse); background: var(--color-on-inverse); color: var(--color-surface-inverse); }
.choice[aria-checked="true"] .choice__radio .i { opacity: 1; }
.choices.is-error .choice { border-color: var(--color-danger-text); }
.choice--goal { min-height: 104px; align-items: flex-start; padding-top: 18px; padding-bottom: 18px; }
.choice--goal .choice__radio { margin-top: 1px; }

/* segmented control, two-by-two variant for 4 options with long labels */
.seg--grid { grid-auto-flow: row; grid-template-columns: 1fr 1fr; }

/* ---------- inline error / note ---------- */
.msg { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.4; font-weight: 600; }
.msg .i { width: 20px; height: 20px; margin-top: 1px; }
.msg--error { color: var(--color-danger-text); }
.msg--note { color: var(--color-text-muted); font-weight: 500; }
.msg--note .i { color: var(--color-text-subtle); }

/* ---------- hero stepper (schedule) ---------- */
.big { display: grid; gap: 10px; padding: 0 16px; }
.big + .big { margin-top: 20px; }
.big__label { padding: 0 4px; font-weight: 600; color: var(--color-text-muted); }
.big__track { display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; gap: 8px; min-height: 100px; padding: 0 12px; border-radius: var(--radius-lg); background: var(--color-surface-sunken); }
.big__btn { width: 64px; height: 64px; display: grid; place-items: center; border-radius: var(--radius-md); background: var(--color-surface); color: var(--color-text); box-shadow: var(--elevation-1); transition: transform var(--duration-instant) var(--ease-snap); }
.big__btn:active { transform: scale(var(--motion-scale-press)); background: color-mix(in srgb, var(--color-surface) 92%, var(--color-text)); }
.big__btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.big__btn[disabled] { background: transparent; color: var(--color-text-disabled); box-shadow: none; cursor: default; }
.big__btn .i { width: 28px; height: 28px; stroke-width: 2.5; }
.big__value { display: flex; align-items: baseline; justify-content: center; gap: 6px; }
.big__value .num { font-size: var(--font-size-96); line-height: 0.8; }
.big__unit { font-size: var(--font-size-24); font-weight: 700; font-stretch: var(--font-width-title); color: var(--color-text-muted); }

/* ---------- split preview ---------- */
.split { padding: 28px var(--layout-gutter) 24px; display: grid; gap: 14px; }
.split__head { display: grid; gap: 4px; }
.split__list { display: grid; gap: 6px; }
.split__row { display: flex; align-items: center; gap: 14px; min-height: 44px; }
.split__tile { width: 40px; height: 40px; flex: none; border-radius: var(--radius-sm); border: var(--border-control) solid var(--color-line-strong); display: grid; place-items: center; font-weight: 800; font-size: 18px; font-stretch: var(--font-width-title); }
.split__tile .i { width: 22px; height: 22px; color: var(--color-text-muted); }
.split__tile--cardio { border-style: dashed; }
.split__name { font-size: 17px; font-weight: 600; line-height: 1.25; }
.split__note { margin-top: 0; }

/* ---------- large numeric field (bodyweight) ---------- */
.numfield { display: grid; gap: 10px; padding: 0 16px; }
.numfield__label { padding: 0 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-weight: 600; }
.numfield__label small { font-size: 14px; font-weight: 500; color: var(--color-text-muted); }
.numfield__box { display: flex; align-items: baseline; gap: 8px; min-height: 96px; padding: 18px 20px 0; border-radius: var(--radius-md); background: var(--color-surface-sunken); border: var(--border-control) solid var(--color-line-strong); }
.numfield__box .num { font-size: var(--font-size-60); line-height: 1; }
.numfield__box .is-placeholder { color: var(--color-text-subtle); }
.numfield__unit { font-size: var(--font-size-24); font-weight: 700; font-stretch: var(--font-width-title); color: var(--color-text-muted); }
.numfield__caret { width: 3px; height: 52px; align-self: center; margin-left: -4px; margin-top: -14px; background: var(--color-text); border-radius: 2px; animation: caret 1.1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
.numfield.is-focus .numfield__box { box-shadow: var(--focus-ring); border-color: var(--color-text); }
.numfield.is-error .numfield__box { border-color: var(--color-danger-text); border-width: var(--border-strong); }
.numfield .msg { padding: 0 4px; }

/* ---------- list rows (summary, settings) ---------- */
.rows { display: grid; grid-template-columns: minmax(0, 1fr); margin: 0 16px; padding: 0; overflow: hidden; }
.row { position: relative; min-width: 0; display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 12px 12px 12px 16px; text-align: left; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 78px; right: 0; height: 1px; background: var(--color-line); }
.rows--plain .row + .row::before { left: 16px; }
.row:active { background: var(--color-press-overlay); }
.row:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--color-focus); }
.row__well { width: 48px; height: 48px; flex: none; border-radius: var(--radius-sm); background: var(--color-surface-sunken); display: grid; place-items: center; }
.row__text { flex: 1; min-width: 0; display: grid; gap: 2px; }
.row__title { font-size: 17px; font-weight: 600; line-height: 1.3; }
.row__meta { font-size: 14px; line-height: 1.4; color: var(--color-text-muted); }
.row__end { flex: none; color: var(--color-text-muted); display: inline-flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 600; }
.row__end .i { width: 22px; height: 22px; }

/* ---------- dock (bottom action area) ---------- */
.dock { flex: none; position: relative; z-index: var(--z-sticky); display: grid; gap: 12px; padding: 12px 16px 42px; background: var(--color-bg); border-top: var(--border-hairline) solid var(--color-line); }
.dock__note { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.4; color: var(--color-text-muted); padding: 0 4px; }
.dock__note .i { width: 20px; height: 20px; flex: none; color: var(--color-text-subtle); }
.dock__note b { color: var(--color-text); font-weight: 600; }

/* live exercise counter in a dock */
.dock__split { display: flex; align-items: center; gap: 16px; }
.counter { flex: none; display: flex; align-items: center; gap: 10px; min-width: 0; }
.counter .num { font-size: var(--font-size-48); line-height: 0.8; }
.counter__label { font-size: 14px; line-height: 1.2; font-weight: 600; color: var(--color-text-muted); max-width: 96px; }
.dock__split .btn { flex: 1; padding: 0 16px; }

/* ---------- dialog ---------- */
.scrim { position: absolute; inset: 0; z-index: var(--z-sheet); background: var(--color-scrim); display: flex; align-items: center; padding: 0 16px; }
.dialog { width: 100%; display: grid; gap: 20px; padding: 24px 20px 20px; border-radius: var(--radius-xl); background: var(--color-surface-raised); color: var(--color-text); box-shadow: var(--elevation-3); }
.dialog__text { display: grid; gap: 10px; }
.dialog__title { font-size: var(--font-size-24); }
.dialog__actions { display: grid; gap: 8px; }

/* ---------- toast placement ---------- */
.toast-slot { position: absolute; left: 16px; right: 16px; z-index: var(--z-toast); }

/* ---------- spinner ---------- */
.spinner { display: block; width: 20px; min-width: 20px; height: 20px; flex: none; border-radius: 50%; border: 2.5px solid var(--color-track); border-top-color: var(--color-accent-line); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .spinner { animation: none; border-color: var(--color-track); border-top-color: var(--color-accent-line); border-right-color: var(--color-accent-line); }
  .numfield__caret { animation: none; }
}

/* ---------- tab bar (outside onboarding) ---------- */
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); padding: 0 8px 34px; background: var(--color-bg); border-top: var(--border-hairline) solid var(--color-line); }
.tab { position: relative; display: grid; justify-items: center; align-content: center; gap: 4px; min-height: 64px; color: var(--color-text-subtle); font-size: 13px; font-weight: 600; font-stretch: var(--font-width-label); text-align: center; line-height: 1.1; }
.tab__icon { display: grid; place-items: center; width: 56px; height: 30px; border-radius: var(--radius-pill); }
.tab.is-current { color: var(--color-text); font-weight: 700; }
.tab.is-current .tab__icon { background: var(--color-surface-inverse); color: var(--color-on-inverse); }

/* ================================================================
   Settings and profile
   ================================================================ */
.sset { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 0 0 8px; }
.intro--root { padding-top: 28px; }
.sset + .sset { margin-top: 28px; }
.sset__title { padding: 0 var(--layout-gutter); }
.sset__field { display: grid; gap: 8px; padding: 0 16px; }
.sset__field + .sset__field { margin-top: 8px; }
.sset__field > .t-meta { padding: 0 4px; }
.sset__label { padding: 0 4px; font-weight: 600; }
.sset__quiet { padding: 6px var(--layout-gutter) 0; color: var(--color-text-subtle); }
.sset--about { padding: 0 0 32px; }
.sset--about > p { padding: 0 var(--layout-gutter); }
.sset--about > .t-meta { margin-top: -6px; }
a.row { color: inherit; text-decoration: none; }

.pf { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding-bottom: 8px; }
.pf + .pf { margin-top: 28px; }
.pf:first-child { padding-top: 8px; }
.pf__title { padding: 0 var(--layout-gutter); }
.pf__hint { padding: 0 var(--layout-gutter); margin-top: -8px; color: var(--color-text-muted); }
.pf__pad { padding: 0 16px; }
.pf .big + .big { margin-top: 8px; }
.pf .big__track { min-height: 88px; }
.pf .big__value .num { font-size: var(--font-size-72); }
.pf__split { display: flex; align-items: center; gap: 12px; padding: 4px var(--layout-gutter) 0; color: var(--color-text-muted); font-size: 15px; }
.pf__tiles { width: auto; padding: 0 8px; letter-spacing: 0.12em; font-size: 15px; color: var(--color-text); height: 32px; }
.choice--compact { min-height: 64px; padding-top: 10px; padding-bottom: 10px; }
.choice--compact .choice__fig .num { font-size: var(--font-size-24); }
.choice--compact .choice__fig small { font-size: 12px; }
.numfield__box--sm { min-height: 72px; padding-top: 12px; }
.numfield__box--sm .num { font-size: var(--font-size-48); }

/* ================================================================
   Shared with the programme screens
   ================================================================ */
.appbar__text { flex: 1; min-width: 0; display: grid; }
.appbar--prog { gap: 12px; padding: 6px 12px 6px var(--layout-gutter); }
.icon-well { width: 48px; height: 48px; flex: none; display: grid; place-items: center; border-radius: var(--radius-sm); background: var(--color-surface-sunken); color: var(--color-text); }
.icon-well--sm { width: 40px; height: 40px; }
.section-title { font-size: var(--type-headline-size); line-height: var(--type-title-line); font-weight: var(--type-title-weight); font-stretch: var(--type-title-width); }

.hero { padding: 28px var(--layout-gutter) 0; display: grid; gap: 14px; }
.hero__week { display: grid; gap: 8px; }
.hero__label { font-size: var(--font-size-18); font-weight: 600; color: var(--color-text-muted); line-height: 1; }
.hero__row { display: flex; align-items: flex-end; gap: 12px; }
.hero__n { font-size: var(--font-size-144); line-height: 0.74; margin-left: -6px; }
.hero__of { font-size: var(--font-size-48); color: var(--color-text-muted); line-height: 0.8; }
.hero__phase { display: grid; gap: 6px; padding-top: 6px; }
.hero__phase .t-display { font-size: var(--font-size-36); }
.hero .segs > i { height: 8px; }
.scroll > .hero:first-child { padding-top: 20px; }

.next { margin: 28px 16px 0; padding: 20px; display: grid; gap: 16px; }
.next__label { font-weight: 600; color: var(--color-text-muted); }
.next__title { font-size: var(--font-size-36); }
.next__muscles { color: var(--color-text-muted); margin-top: 6px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.facts li { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 15px; }
.facts .i { width: 20px; height: 20px; color: var(--color-text-muted); }

/* notice: information only */
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius-md); background: var(--color-surface-sunken); font-size: var(--type-meta-size); line-height: 1.4; color: var(--color-text); }
.notice .i { width: 20px; height: 20px; color: var(--color-text-muted); margin-top: 1px; }
.notice b { font-weight: 700; }

/* banner (design system 9.5) */
.banner { margin: 8px 16px 0; padding: 16px; display: grid; gap: 14px; border-radius: var(--radius-lg); background: var(--color-surface); border: var(--border-control) solid var(--color-line-strong); box-shadow: var(--elevation-1); }
.banner__head { display: flex; gap: 14px; align-items: flex-start; }
.banner__text { flex: 1; min-width: 0; display: grid; gap: 4px; }
.banner__title { font-size: var(--font-size-18); font-weight: 700; font-stretch: var(--font-width-title); line-height: 1.2; }
.banner__actions { display: grid; gap: 4px; }
.banner__actions .btn--ghost { justify-self: start; min-height: var(--tap-min); padding: 0 4px; }

/* firm banner: stronger edge, inverse icon well (never red: it is not a destructive action) */
.banner--firm { border: var(--border-strong) solid var(--color-text); }
.banner--firm .icon-well { background: var(--color-surface-inverse); color: var(--color-on-inverse); }

/* resume banner: an open session */
.banner--resume { gap: 16px; }
.banner__progress { display: grid; gap: 8px; }
.banner__progress-line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; color: var(--color-text-muted); font-weight: 600; }
.banner__progress-line b { color: var(--color-text); font-weight: 700; }
.banner__pair { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 8px; margin-top: -4px; }
.banner__pair .btn--ghost { min-height: var(--tap-min); padding: 0 4px; }
.banner--resume .btn--player { font-size: var(--font-size-21); }

/* ---------- sheets ---------- */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: calc(var(--z-sheet) + 1); max-height: calc(100% - 64px); display: flex; flex-direction: column; border-radius: var(--radius-xl) var(--radius-xl) 0 0; background: var(--color-surface-raised); box-shadow: var(--elevation-3); }
.sheet__grab { align-self: center; flex: none; width: 40px; height: 5px; margin: 10px 0 6px; border-radius: 3px; background: var(--color-line-strong); }
.sheet__body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 8px var(--layout-gutter) 20px; display: grid; gap: 20px; align-content: start; }
.sheet__body::-webkit-scrollbar { display: none; }
.sheet__foot { flex: none; display: grid; gap: 8px; padding: 12px 16px 42px; border-top: var(--border-hairline) solid var(--color-line); }
.sheet__eyebrow { font-size: var(--type-meta-size); font-weight: 600; color: var(--color-text-muted); }
.sheet__title { font-size: var(--font-size-36); line-height: var(--line-height-display); font-weight: 800; font-stretch: var(--font-width-display); text-wrap: balance; }
.scrim--sheet { display: block; padding: 0; }

/* ---------- switch (new) ---------- */
.switch { position: relative; flex: none; width: 52px; height: 32px; border-radius: var(--radius-pill); background: var(--color-surface-sunken); border: var(--border-strong) solid var(--color-line-strong); transition: background-color var(--duration-fast) var(--ease-move), border-color var(--duration-fast) var(--ease-move); }
.switch::after { content: ""; position: absolute; top: 50%; left: 4px; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; background: var(--color-text-muted); transition: transform var(--duration-fast) var(--ease-move), width var(--duration-fast) var(--ease-move), height var(--duration-fast) var(--ease-move), margin var(--duration-fast) var(--ease-move), background-color var(--duration-fast) var(--ease-move); }
[aria-checked="true"] .switch { background: var(--color-surface-inverse); border-color: var(--color-surface-inverse); }
[aria-checked="true"] .switch::after { width: 22px; height: 22px; margin-top: -11px; transform: translateX(19px); background: var(--color-on-inverse); }
[aria-disabled="true"] .switch { background: transparent; border-style: dashed; border-color: var(--color-text-disabled); }
[aria-disabled="true"] .switch::after { background: var(--color-text-disabled); }
@media (prefers-reduced-motion: reduce) { .switch, .switch::after { transition-duration: 100ms; transition-property: background-color, border-color; } }

.swrow { position: relative; width: 100%; display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 14px 16px; text-align: left; }
.swrow:active { background: var(--color-press-overlay); }
.swrow:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--color-focus); }
.swrow__text { flex: 1; min-width: 0; display: grid; gap: 3px; }
.swrow__title { font-size: 17px; font-weight: 600; line-height: 1.3; }
.swrow__meta { font-size: 14px; line-height: 1.4; color: var(--color-text-muted); }
.swrow[aria-disabled="true"] { cursor: default; }
.swrow[aria-disabled="true"] .swrow__title { color: var(--color-text-muted); }
.rows .swrow + .swrow::before, .rows .row + .swrow::before, .rows .swrow + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--color-line); }

/* ---------- backup line (new) ---------- */
.bline { display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 14px; border-radius: var(--radius-md); background: var(--color-surface-sunken); }
.bline > .i { width: 20px; height: 20px; color: var(--color-text-muted); }
.bline__text { flex: 1; min-width: 0; font-size: 14px; line-height: 1.35; }
.bline__text b { font-weight: 700; }
.bline .btn { min-height: var(--tap-min); padding: 0 16px; font-size: var(--type-label-size-sm); background: var(--color-surface); }
.bline--firm { box-shadow: inset 0 0 0 var(--border-strong) var(--color-text); }
.bline--firm > .i { color: var(--color-text); }

/* ================================================================
   Settings: during a workout + data
   ================================================================ */
.sset .rows { margin: 0 16px; }
.sset__hint { padding: 0 var(--layout-gutter); margin-top: -6px; color: var(--color-text-muted); }

/* rest screen choice: two tiles with a miniature of each look */
.restpick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.restopt { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; min-height: 96px; padding: 12px; border-radius: var(--radius-lg); border: var(--border-control) solid var(--color-line-strong); background: var(--color-surface); text-align: left; transition: background-color var(--duration-fast) var(--ease-move); }
.restopt:active { transform: scale(var(--motion-scale-press)); }
.restopt:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.restopt__text { display: grid; gap: 2px; min-width: 0; }
.restopt__title { font-size: 17px; font-weight: 700; font-stretch: var(--font-width-title); line-height: 1.2; }
.restopt__sub { font-size: 13px; line-height: 1.3; color: var(--color-text-muted); }
.restopt[aria-checked="true"] { background: var(--color-surface-inverse); border-color: var(--color-surface-inverse); color: var(--color-on-inverse); }
.restopt[aria-checked="true"] .restopt__sub { color: var(--color-on-inverse); opacity: 0.78; }
.mini { width: 44px; height: 72px; border-radius: 9px; border: var(--border-control) solid currentColor; display: grid; place-items: center; overflow: hidden; position: relative; }
.mini--takeover { background: var(--color-rest-bg); border-color: var(--color-rest-bg); color: var(--color-on-rest); }
.mini--takeover b { font-size: 26px; font-weight: 800; font-stretch: 62%; line-height: 1; }
.mini--takeover i { position: absolute; left: 6px; right: 6px; bottom: 9px; height: 3px; border-radius: 2px; background: var(--color-on-rest); }
.mini--ring { background: var(--color-bg); color: var(--color-text); border-color: var(--color-line-strong); }
.mini--ring svg { width: 34px; height: 34px; }
.mini--ring b { position: absolute; font-size: 13px; font-weight: 800; font-stretch: 62%; }

/* data screen */
.dsec { display: grid; gap: 14px; padding: 0 var(--layout-gutter); }
.scroll > .dsec:first-child, .done-note + .dsec { padding-top: 16px; }
.dsec + .dsec { margin-top: 36px; }
.dsec__head { display: grid; gap: 4px; }
.last { display: grid; gap: 6px; }
.last__label { font-size: 15px; font-weight: 600; color: var(--color-text-muted); }
.last__value { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.last__value .num { font-size: var(--font-size-72); line-height: 0.8; }
.last__word { font-size: var(--font-size-36); font-weight: 800; font-stretch: var(--font-width-display); line-height: 1; }
.last__unit { font-size: var(--font-size-24); font-weight: 700; font-stretch: var(--font-width-title); color: var(--color-text-muted); }
.last__meta { font-size: 14px; color: var(--color-text-muted); line-height: 1.4; }
.action { display: grid; gap: 8px; }
.action .t-meta { color: var(--color-text-muted); padding: 0 4px; }
.status { display: flex; gap: 14px; align-items: flex-start; padding: 16px; }
.status__text { flex: 1; min-width: 0; display: grid; gap: 4px; }
.status__title { font-size: var(--font-size-18); font-weight: 700; font-stretch: var(--font-width-title); line-height: 1.2; }
.status__meta { font-size: 14px; line-height: 1.4; color: var(--color-text-muted); }
.status--firm { border: var(--border-strong) solid var(--color-text); }
.status--firm .icon-well { background: var(--color-surface-inverse); color: var(--color-on-inverse); }
.status .msg { margin-top: 6px; font-size: 14px; }
.done-note { margin: 4px 16px 24px; }
.done-note .notice { align-items: flex-start; }
.done-note .notice .i { color: var(--color-text); }
.filename { font-weight: 600; overflow-wrap: anywhere; }

/* import preview: this file vs this phone */
.cmp { display: grid; grid-template-columns: minmax(0, 1fr) 84px 96px; align-items: stretch; }
.cmp > * { padding: 9px 0 9px 8px; border-top: var(--border-hairline) solid var(--color-line); }
.cmp > .cmp__k { padding-left: 0; display: flex; align-items: center; }
.cmp > .cmp__v, .cmp > .cmp__h { display: flex; align-items: center; justify-content: flex-end; }
.cmp > .cmp__h { align-items: flex-end; }
.cmp > .cmp__h { border-top: 0; padding: 0 0 8px 8px; font-size: 13px; font-weight: 700; font-stretch: var(--font-width-label); color: var(--color-text-muted); text-align: right; line-height: 1.2; }
.cmp > .cmp__h:first-child { text-align: left; }
.cmp__k { font-size: 16px; font-weight: 600; line-height: 1.3; }
.cmp__v { text-align: right; font-size: var(--font-size-24); line-height: 1; }
.cmp__v--phone { color: var(--color-text-muted); }
.cmp__v .i { width: 20px; height: 20px; stroke-width: 2.6; vertical-align: -2px; }
.sheet__lede { display: grid; gap: 6px; }
.sheet__file { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--color-text-muted); }
.sheet__file .i { width: 20px; height: 20px; }
.sheet__err { display: grid; gap: 14px; padding-top: 8px; }
.sheet__err .icon-well { width: 48px; height: 48px; }
.notice--alert { background: var(--color-surface-sunken); box-shadow: inset 0 0 0 var(--border-control) var(--color-line-strong); }
.notice--alert .i { color: var(--color-text); }

.dialog__status { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--color-text-muted); font-weight: 600; }
.btn[aria-busy="true"] { pointer-events: none; }
.btn--destructive[aria-busy="true"] .spinner { border-color: color-mix(in srgb, var(--color-on-danger) 30%, transparent); border-top-color: var(--color-on-danger); }

.toast-slot--tab { bottom: 114px; }
</style>

    sw.setAttribute('aria-checked', String(sw.getAttribute('aria-checked') !== 'true'));
    renderLines();
  });
  document.addEventListener('mock:render', renderLines);
  renderLines();
})();
</script>
