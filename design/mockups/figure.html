<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exercise figure and how-to sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<link rel="stylesheet" href="../../src/ui/tokens.css">
<style>
/* ---------- mockup shell ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font-sans); font-stretch: var(--font-width-text); font-size: var(--type-body-size); line-height: var(--type-body-line); color: var(--color-text); background: color-mix(in srgb, var(--color-bg) 88%, var(--color-text)); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
:root[lang="fr"] .en, :root[lang="en"] .fr { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; text-align: inherit; }
h1, h2, h3, p, ul, ol, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
svg.i { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mock-bar { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding: 12px 24px; background: color-mix(in srgb, var(--color-bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--color-line); font-size: 14px; }
.mock-bar__title { font-weight: 700; font-stretch: var(--font-width-title); font-size: 18px; }
.mock-bar__nav { display: flex; flex-wrap: wrap; gap: 4px; margin-right: auto; }
.mock-bar__nav a { min-height: 32px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: var(--radius-pill); color: var(--color-text-muted); font-weight: 600; text-decoration: none; font-stretch: var(--font-width-label); }
.mock-bar__nav a:hover { background: var(--color-surface-sunken); color: var(--color-text); }
.mock-toggle { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--radius-pill); background: var(--color-surface-sunken); }
.mock-toggle button { min-height: 32px; padding: 0 14px; border-radius: var(--radius-pill); font-weight: 600; font-size: 14px; color: var(--color-text-muted); }
.mock-toggle button[aria-pressed="true"] { background: var(--color-surface-inverse); color: var(--color-on-inverse); }
.mock-toggle button:focus-visible, .mock-bar__nav a:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.mock-stage { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 40px; padding: 32px 24px 64px; }
.mock-sec { flex: 0 0 100%; max-width: 1280px; display: grid; gap: 6px; padding-top: 24px; border-top: 1px solid var(--color-line); scroll-margin-top: 72px; }
.mock-sec:first-child { border-top: 0; padding-top: 0; }
.mock-sec h2 { font-size: var(--font-size-24); font-weight: 800; font-stretch: var(--font-width-display); }
.mock-sec p { color: var(--color-text-muted); font-size: 15px; max-width: 64ch; }
.mock-shot { display: flex; flex-direction: column; gap: 14px; align-items: center; }
.mock-shot figcaption { font-size: 15px; font-weight: 600; color: var(--color-text-muted); max-width: 390px; text-align: center; text-wrap: balance; }
.mock-wide { flex: 0 0 100%; max-width: 1280px; }

/* ---------- phone ---------- */
.device { position: relative; width: 390px; height: 844px; flex: none; display: flex; flex-direction: column; border-radius: 48px; overflow: hidden; isolation: isolate; background: var(--color-bg); color: var(--color-text); box-shadow: 0 0 0 1px var(--color-line), 0 24px 80px rgb(0 0 0 / 0.28); }
.device--short { width: 375px; height: 667px; border-radius: 28px; }
.device--short .statusbar { height: 20px; font-size: 12px; padding: 2px 16px 0; }
.device--short .dock { padding-bottom: 14px; }
.device--short .homebar { display: none; }
@media (max-width: 440px) { .mock-stage { padding: 16px 0 48px; gap: 32px; } .mock-sec { padding-left: 16px; padding-right: 16px; } .device { width: 100vw; border-radius: 0; box-shadow: none; } }
.statusbar { height: 47px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 4px 30px 0 40px; font-size: 16px; font-weight: 600; font-stretch: 100%; }
.statusbar svg { height: 12px; fill: currentColor; }
.homebar { position: absolute; z-index: 60; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: currentColor; opacity: 0.85; pointer-events: none; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }

/* ---------- type ---------- */
.num { font-stretch: var(--type-numeral-width); font-weight: var(--type-numeral-weight); font-variant-numeric: tabular-nums lining-nums; letter-spacing: var(--type-numeral-tracking); line-height: var(--type-numeral-line); }
.t-exercise { font-size: var(--type-exercise-size); line-height: var(--type-exercise-line); font-weight: var(--type-exercise-weight); font-stretch: var(--type-exercise-width); letter-spacing: var(--letter-spacing-display); text-wrap: balance; }
.t-display { font-size: var(--type-display-size); line-height: var(--type-display-line); font-weight: var(--type-display-weight); font-stretch: var(--type-display-width); letter-spacing: var(--letter-spacing-display); text-wrap: balance; }
.t-title { font-size: var(--type-title-size); line-height: var(--type-title-line); font-weight: var(--type-title-weight); font-stretch: var(--type-title-width); text-wrap: balance; }
.t-meta { font-size: var(--type-meta-size); line-height: 1.4; }
.muted { color: var(--color-text-muted); }

/* ---------- controls ---------- */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: var(--tap-comfort); padding: 0 var(--space-6); border-radius: var(--radius-md); border: var(--border-control) solid transparent; font-size: var(--type-label-size); line-height: var(--type-label-line); font-weight: var(--type-label-weight); font-stretch: var(--type-label-width); text-align: center; }
.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.btn--primary { background: var(--color-accent); color: var(--color-on-accent); }
.btn--secondary { border-color: var(--color-line-strong); color: var(--color-text); }
.btn--block { width: 100%; }
.btn--player { min-height: var(--tap-player); font-size: var(--font-size-21); }
.icon-btn { display: inline-grid; place-items: center; width: var(--tap-min); height: var(--tap-min); border-radius: var(--radius-md); color: var(--color-text); flex: none; }
.icon-btn--player { width: var(--tap-player); height: var(--tap-player); border: var(--border-control) solid var(--color-line-strong); }
.icon-btn--outline { border: var(--border-control) solid var(--color-line-strong); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: var(--radius-md); background: var(--color-surface-sunken); }
.seg__opt { min-height: var(--tap-min); border-radius: 10px; font-weight: 700; font-stretch: var(--font-width-label); font-size: var(--type-label-size-sm); color: var(--color-text-muted); text-align: center; padding: 0 12px; }
.seg__opt[aria-checked="true"] { background: var(--color-surface-inverse); color: var(--color-on-inverse); }
.seg--ask { background: none; box-shadow: inset 0 0 0 var(--border-control) var(--color-line-strong); }
.seg--ask .seg__opt { color: var(--color-text); }
.segs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.segs > i { height: 6px; border-radius: var(--radius-xs); background: var(--color-track); }
.segs > i.done { background: var(--color-text-subtle); }
.segs > i.cur { background: var(--color-accent-line); }

/* ---------- player ---------- */
.pbar { flex: none; display: flex; align-items: center; gap: 4px; padding: 4px 8px; min-height: 56px; }
.pbar__mid { flex: 1; min-width: 0; display: grid; gap: 6px; padding: 0 8px; }
.pbar__mid .t-meta { font-weight: 600; color: var(--color-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbar__clock { font-size: var(--font-size-21); color: var(--color-text-muted); padding: 0 4px; }
.pa { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 8px var(--layout-gutter) 0; gap: 16px; }
.device--short .pa { gap: 12px; padding-top: 0; }
.device--short .pbar { min-height: 52px; }
.pa-set { display: grid; gap: 8px; }
.pa-set__row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.pa-set__label { display: flex; align-items: baseline; gap: 10px; font-weight: 700; font-stretch: var(--font-width-title); font-size: var(--font-size-24); }
.pa-set__label .num { font-size: var(--font-size-48); }
.pa-set__label .of { color: var(--color-text-muted); }
.pa-set .segs > i { height: 8px; }
.score { display: grid; grid-template-columns: minmax(min-content, 1.45fr) minmax(min-content, 1fr); gap: 12px 20px; }
.score__cell { display: grid; gap: 6px; align-content: start; min-width: 0; }
.score__top { display: flex; align-items: flex-start; gap: 10px; }
.score__n { font-size: var(--type-numeral-xl-size); white-space: nowrap; }
.score__w { font-size: var(--font-size-36); line-height: var(--line-height-display); font-weight: 800; font-stretch: var(--font-width-display); padding-top: 6px; }
.score__u { font-size: var(--font-size-18); font-weight: 600; color: var(--color-text-muted); line-height: 1.2; }
.badge { display: inline-flex; align-items: center; min-height: 26px; padding: 0 9px; border-radius: var(--radius-pill); border: var(--border-control) solid var(--color-line-strong); font-size: 14px; font-weight: 700; font-stretch: var(--font-width-label); white-space: nowrap; }
.tempo { display: grid; gap: 4px; grid-template-columns: 2fr 1fr 2fr; }
.tempo__seg { display: grid; align-content: center; gap: 2px; min-height: 52px; padding: 0 10px; border-radius: var(--radius-xs); background: var(--color-surface-sunken); color: var(--color-text-muted); font-weight: 700; font-stretch: var(--font-width-label); font-size: 13px; line-height: 1.1; white-space: nowrap; }
.tempo__seg b { font-size: var(--font-size-21); font-weight: 800; font-stretch: var(--font-width-title); line-height: 1; color: var(--color-text); }
.items { display: flex; gap: 6px; }
.items > i { display: grid; place-items: center; width: 44px; height: 44px; border-radius: var(--radius-sm); border: var(--border-control) solid var(--color-line-strong); font-style: normal; font-size: var(--font-size-21); font-weight: 800; font-stretch: var(--font-width-title); }
.items > i.done { background: var(--color-complete); border-color: var(--color-complete); }
.items > i.cur { border: 3px solid var(--color-accent-line); }
.sides { display: flex; gap: 6px; }
.sides > i { display: grid; place-items: center; width: 60px; height: 60px; border-radius: var(--radius-md); border: var(--border-control) solid var(--color-line-strong); font-style: normal; font-size: var(--font-size-48); font-weight: 800; font-stretch: var(--font-width-numeral); line-height: 1; }
.sides > i.done { background: var(--color-complete); border-color: var(--color-complete); }
.sides > i.cur { background: var(--color-surface-inverse); border-color: var(--color-surface-inverse); color: var(--color-on-inverse); }
.nextup { display: grid; grid-template-columns: auto auto 1fr; align-items: center; gap: 6px 12px; padding: 4px 0 4px 14px; border-left: var(--border-strong) solid var(--color-line-strong); }
.nextup__label { font-size: 14px; font-weight: 600; color: var(--color-text-muted); }
.nextup__tile { display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius-sm); border: var(--border-control) solid var(--color-line-strong); font-weight: 800; font-size: 18px; font-stretch: var(--font-width-title); }
.nextup__body { display: grid; min-width: 0; line-height: 1.25; }
.nextup__body b { font-size: var(--font-size-18); font-stretch: var(--font-width-title); }
.nextup__body span { font-size: 14px; color: var(--color-text-muted); }
.dock { flex: none; display: grid; gap: 10px; padding: 14px 16px 42px; }
.dock__row { display: flex; gap: 10px; }
.dock__done { flex: 1; justify-content: flex-start; gap: 14px; padding: 0 20px; text-align: left; }
.dock__done .i { width: 28px; height: 28px; stroke-width: 3; }
.dock__done-text { display: grid; gap: 1px; }
.dock__done-text small { font-size: 14px; font-weight: 600; color: var(--color-on-accent-muted); font-stretch: var(--font-width-text); }
.dock__second { flex: 1; justify-content: flex-start; padding: 0 20px; text-align: left; }
.dock__second small { display: block; font-size: 14px; font-weight: 600; color: var(--color-text-muted); font-stretch: var(--font-width-text); }
.clock { display: flex; align-items: flex-end; gap: 8px; margin-left: -10px; }
.clock__n { font-size: var(--type-timer-size); line-height: 0.76; }
.clock__u { font-size: var(--font-size-48); font-weight: 800; font-stretch: var(--font-width-display); padding-bottom: 4px; }
.clock--phase .clock__n { font-size: var(--font-size-240); line-height: 0.78; }
.tbar { position: relative; height: 10px; border-radius: var(--radius-xs); background: var(--color-track); }
.tbar > i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--color-accent-line); }
.tbar__tick { position: absolute; top: -8px; bottom: -8px; width: 3px; margin-left: -1.5px; border-radius: 2px; background: var(--color-text); }
.ivh { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.ivh__phase { font-size: var(--font-size-48); line-height: var(--line-height-display); font-weight: 800; font-stretch: var(--font-width-display); }
.ivh__round { display: flex; align-items: baseline; gap: 8px; font-size: var(--font-size-21); font-weight: 700; font-stretch: var(--font-width-title); }
.ivh__round .num { font-size: var(--font-size-48); }
.ivsegs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.ivsegs > i { display: grid; grid-template-columns: 2fr 3fr; gap: 2px; }
.ivsegs > i::before, .ivsegs > i::after { content: ""; height: 8px; border-radius: 2px; background: var(--color-rest-track); }
.ivsegs > i.done::before, .ivsegs > i.done::after, .ivsegs > i.rec::before { background: var(--color-on-rest-muted); }
.ivsegs > i.rec::after { background: var(--color-on-rest); }
.ivnext { font-size: var(--font-size-18); font-weight: 600; color: var(--color-on-rest-muted); }
.ivnext b { color: var(--color-on-rest); }

/* rest takeover */
.device--rest { background: var(--color-rest-bg); color: var(--color-on-rest); }
.device--rest .pbar__mid .t-meta, .device--rest .icon-btn { color: var(--color-on-rest); }
.device--rest .pbar__clock, .device--rest .muted { color: var(--color-on-rest-muted); }
.device--rest .segs > i { background: var(--color-rest-track); }
.device--rest .segs > i.done { background: var(--color-on-rest-muted); }
.device--rest .segs > i.cur { background: var(--color-on-rest); }
.device--rest .dock__second { border: var(--border-strong) solid var(--color-on-rest); }
.device--rest .dock__second small { color: var(--color-on-rest-muted); }
.ra { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 var(--layout-gutter) 42px; }
.ra-done { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--color-on-rest-muted); }
.ra-done .i { width: 20px; height: 20px; stroke-width: 3; color: var(--color-on-rest); }
.ra-timer { display: flex; align-items: flex-end; gap: 8px; margin: 0 0 0 -12px; }
.ra-timer .clock__n { font-size: var(--type-timer-size); }
.ra-bar { margin-top: 22px; height: 10px; border-radius: var(--radius-xs); background: var(--color-rest-track); overflow: hidden; }
.ra-bar i { display: block; height: 100%; background: var(--color-on-rest); }
.ra-center { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 24px; }
.ra-ctrls { display: grid; grid-template-columns: 1fr 1fr 1.25fr; gap: 10px; margin-top: 12px; }
.ra-ctrls .btn { min-height: var(--tap-player); padding: 0 8px; font-size: var(--font-size-21); }
.btn--on-rest { border: var(--border-strong) solid var(--color-on-rest); color: var(--color-on-rest); }
.btn--on-rest-solid { background: var(--color-rest-surface); color: var(--color-accent); }

.device--rest .sheet .icon-btn { color: var(--color-text); }
.device--rest .sheet .muted { color: var(--color-text-muted); }

/* ===================================================================== */
/* The figure                                                             */
/* ===================================================================== */
.fg { position: absolute; inset: 0; display: block; }
.fg-cut { fill: none; stroke: var(--figure-cut); stroke-linejoin: round; }
.fg-body { fill: var(--figure-body); }
.fg-limb { fill: var(--figure-limb); }
.fg-limbfar { fill: var(--figure-limb-far); }
.fg-far { fill: var(--figure-far); }
.fg-prop { fill: var(--figure-prop); }
.fg-propfar { fill: var(--figure-prop-far); }
.fg-door { fill: var(--figure-door); }
.fg-shadow { fill: var(--figure-shadow); }
.fg-floor { fill: none; stroke: var(--figure-floor); stroke-width: 1; }
.fgm { position: absolute; inset: 0; }
.fgm .fg { animation: fg-in var(--duration-base) var(--ease-move); }
@keyframes fg-in { from { opacity: 0; } }

/* The slot: one button, the figure fills it; overlays reserve space so they never sit on the figure. */
.slot { position: relative; display: block; width: 100%; flex: 1; min-height: 96px; overflow: hidden; border: var(--border-hairline) solid var(--color-line); border-radius: var(--radius-lg); background: radial-gradient(120% 90% at 50% 38%, var(--color-surface-raised) 0%, var(--color-surface) 62%); container-type: size; text-align: left; }
.slot:active { background: radial-gradient(120% 90% at 50% 38%, color-mix(in srgb, var(--color-surface-raised) 92%, var(--color-text)) 0%, var(--color-surface) 62%); }
.slot:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--color-focus); }
.slot__cue { position: absolute; left: 16px; right: 52px; bottom: 12px; margin: 0; color: var(--color-text-muted); font-size: 15px; font-weight: 600; line-height: 1.3; text-wrap: pretty; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
.slot__more { position: absolute; right: 8px; bottom: 8px; display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius-pill); background: var(--color-surface-sunken); color: var(--color-text-muted); }
.slot__more .i { width: 18px; height: 18px; stroke-width: 2.2; }
.slot__side { position: absolute; top: 10px; left: 10px; display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px 0 4px; border-radius: var(--radius-pill); background: var(--color-surface-sunken); font-size: 14px; font-weight: 700; font-stretch: var(--font-width-label); }
.slot__side b { display: grid; place-items: center; width: 22px; height: 22px; border-radius: var(--radius-pill); background: var(--color-surface-inverse); color: var(--color-on-inverse); font-size: 14px; font-weight: 800; }
.why { position: absolute; top: 8px; right: 8px; left: 8px; z-index: 1; display: flex; align-items: flex-start; gap: 8px; padding: 8px 12px; border-radius: var(--radius-md); background: var(--color-surface-sunken); font-size: 15px; font-weight: 600; line-height: 1.25; }
.why .i { width: 20px; height: 20px; color: var(--color-text-muted); }
.why span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
@container (max-height: 199px) { .slot__cue { display: none; } }
@container (max-height: 139px) {
  .why { top: 8px; bottom: 8px; right: auto; width: calc(100% - 136px); align-items: center; font-size: 14px; }
  .why span { -webkit-line-clamp: 4; line-clamp: 4; }
}
/* loading and unavailable */
.slot__wait { position: absolute; inset: auto 0 0 0; height: 100%; }
.slot__wait::before { content: ""; position: absolute; left: 0; right: 0; bottom: var(--floor, 14%); border-top: 1px solid var(--figure-floor); }
.slot__wait::after { content: ""; position: absolute; left: 50%; bottom: calc(var(--floor, 14%) - 5px); width: 34%; max-width: 140px; height: 10px; margin-left: min(-17%, -70px); border-radius: 50%; background: var(--figure-shadow); }
svg.slot__glyph { position: absolute; left: 50%; top: 42%; width: 64px; height: 64px; margin: -32px 0 0 -32px; color: var(--color-text-subtle); stroke-width: 1.4; }
@container (max-height: 120px) { svg.slot__glyph { top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; } }
/* on yellow */
.device--rest .slot { background: transparent; border-color: var(--color-rest-track); }
.device--rest .slot__more { background: none; box-shadow: inset 0 0 0 var(--border-control) var(--color-on-rest); color: var(--color-on-rest); }
.device--rest .slot__cue { color: var(--color-on-rest-muted); }

/* Thumbnails */
.thumb { position: relative; flex: none; width: 56px; height: 56px; overflow: hidden; border: var(--border-hairline) solid var(--color-line); border-radius: var(--radius-sm); background: radial-gradient(120% 90% at 50% 38%, var(--color-surface-raised) 0%, var(--color-surface) 62%); }
.thumb--72 { width: 72px; height: 72px; }
.thumb--ink { border-color: var(--palette-graphite-700); background: var(--palette-graphite-850); }

/* ---------- sheet ---------- */
.scrim { position: absolute; inset: 0; z-index: var(--z-sheet); background: var(--color-scrim); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: calc(var(--z-sheet) + 1); display: flex; flex-direction: column; max-height: 90%; border-radius: var(--radius-xl) var(--radius-xl) 0 0; background: var(--color-surface-raised); color: var(--color-text); box-shadow: var(--elevation-3); overflow: hidden; }
.sheet__grab { flex: none; align-self: center; width: 40px; height: 5px; margin: 10px 0 6px; border-radius: 3px; background: var(--color-line-strong); }
.howto__band { flex: none; position: relative; display: flex; align-items: center; gap: 12px; padding: 4px 20px 10px; background: var(--color-rest-bg); color: var(--color-on-rest); }
.howto__band .sheet__grab { position: absolute; top: 0; left: 50%; margin-left: -20px; background: var(--color-rest-track); }
.howto__band-label { font-size: var(--font-size-18); font-weight: 700; font-stretch: var(--font-width-title); padding-top: 14px; }
.howto__band-n { margin-left: auto; display: flex; align-items: baseline; gap: 4px; padding-top: 12px; }
.howto__band-n .num { font-size: var(--font-size-48); }
.howto__band-n span:last-child { font-size: var(--font-size-21); font-weight: 800; font-stretch: var(--font-width-display); }
.howto__band-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--color-rest-track); }
.howto__band-bar i { display: block; height: 100%; background: var(--color-on-rest); }
.howto__head { flex: none; display: grid; grid-template-columns: 1fr 48px; align-items: start; gap: 2px 8px; padding: 0 12px 0 20px; }
.howto__head--band { padding-top: 12px; }
.howto__head--view { grid-template-columns: 48px 1fr; padding: 4px 20px 0 8px; }
.howto__name { padding-top: 8px; font-size: var(--font-size-24); }
.howto__meta { grid-column: 1; display: flex; gap: 8px; align-items: center; font-size: var(--type-meta-size); font-weight: 600; color: var(--color-text-muted); line-height: 1.3; }
.howto__head--view .howto__meta { grid-column: 2; }
.howto__meta .i { width: 18px; height: 18px; }
.howto__stage { flex: none; position: relative; height: clamp(180px, 30vh, 260px); margin: 14px 16px 0; overflow: hidden; border: var(--border-hairline) solid var(--color-line); border-radius: var(--radius-lg); background: var(--color-surface); --figure-cut: var(--color-surface); }
.device .howto__stage { height: 236px; }
.device--short .howto__stage { height: 184px; }
.howto__ctrls { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 16px 0; }
.howto__ctrls .seg { margin-left: auto; padding: 3px; }
.howto__ctrls .seg__opt { min-height: 42px; }
.howto__pace { margin-left: auto; display: flex; align-items: center; gap: 8px; min-height: 48px; font-size: 14px; font-weight: 600; color: var(--color-text-muted); }
.howto__pace b { color: var(--color-text); }
.playbtn { display: inline-flex; align-items: center; gap: 8px; min-height: var(--tap-min); padding: 0 16px 0 12px; border-radius: var(--radius-md); border: var(--border-control) solid var(--color-line-strong); font-weight: 700; font-stretch: var(--font-width-label); font-size: var(--type-label-size-sm); }
.playbtn .i { width: 20px; height: 20px; }
.howto__body[data-scroll] { border-top: var(--border-hairline) solid var(--color-line); margin-top: 10px; }
.howto__body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 18px 20px 20px; display: grid; gap: 18px; align-content: start; }
.howto__cue { padding: 2px 0 2px 14px; border-left: var(--border-strong) solid var(--color-text); font-size: var(--font-size-18); font-weight: 600; line-height: 1.4; text-wrap: pretty; }
.steps { display: grid; gap: 14px; counter-reset: step; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; font-size: var(--type-body-size); line-height: 1.5; text-wrap: pretty; }
.steps li::before { counter-increment: step; content: counter(step); font-size: var(--font-size-24); font-weight: 800; font-stretch: var(--font-width-numeral); font-variant-numeric: tabular-nums; line-height: 1; color: var(--color-text-subtle); padding-top: 1px; }
.sheet__foot { flex: none; display: grid; gap: 10px; padding: 12px 16px 42px; border-top: var(--border-hairline) solid var(--color-line); background: var(--color-surface-raised); }
.device--short .sheet__foot { padding-bottom: 14px; }

/* ---------- lists and screens behind ---------- */
.ctxbar { flex: none; display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 4px 8px 4px 4px; }
.ctxbar__titles { flex: 1; min-width: 0; display: grid; }
.ctxbar__title { font-size: var(--font-size-18); font-weight: 700; font-stretch: var(--font-width-title); line-height: 1.2; }
.ctxbar__sub { font-size: var(--type-meta-size); color: var(--color-text-muted); }
.page { padding: 8px var(--layout-gutter) 24px; display: grid; gap: 16px; align-content: start; }
.search { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 4px 0 14px; border-radius: var(--radius-md); background: var(--color-surface-sunken); border: var(--border-control) solid var(--color-line-strong); color: var(--color-text-subtle); font-size: 17px; font-weight: 500; }
.hintline { display: flex; gap: 8px; align-items: center; font-size: var(--type-meta-size); color: var(--color-text-muted); }
.hintline .i { width: 18px; height: 18px; color: var(--color-text-subtle); }
.plist { display: grid; }
.plist > li { display: grid; grid-template-columns: 72px 1fr; align-items: stretch; border-top: var(--border-hairline) solid var(--color-line); }
.plist > li:first-child { border-top: 0; }
.pthumb { display: grid; place-items: center start; padding: 10px 0 10px 4px; border-radius: var(--radius-sm); }
.pthumb:focus-visible, .pick:focus-visible, .rxhead:focus-visible, .howrow:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--color-focus); }
.pick { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 12px; min-height: 76px; padding: 10px 4px 10px 0; text-align: left; }
.pick__name { display: block; font-size: 17px; font-weight: 700; font-stretch: var(--font-width-title); line-height: 1.2; }
.pick__meta { display: block; margin-top: 3px; font-size: 13px; color: var(--color-text-muted); line-height: 1.35; }
.is-pressed { background: var(--color-press-overlay); }
.rx { display: grid; grid-template-columns: 26px 1fr 48px; column-gap: 8px; padding: 14px 0 18px; border-top: var(--border-hairline) solid var(--color-line); }
.rx:first-child { border-top: 0; }
.rx__idx { font-size: var(--font-size-21); color: var(--color-text-subtle); padding-top: 18px; line-height: 1; }
.rxhead { display: grid; grid-template-columns: 56px 1fr; align-items: center; gap: 12px; min-height: 56px; border-radius: var(--radius-sm); text-align: left; }
.rxhead__name { font-size: var(--font-size-21); line-height: 1.12; font-weight: 700; font-stretch: var(--font-width-title); text-wrap: balance; }
.rx__why { margin: 4px -8px 0 0; color: var(--color-text-muted); }
.rx__body { grid-column: 2 / 4; display: grid; gap: 8px; padding-top: 10px; }
.rx__nums { display: flex; gap: 24px; }
.rx__cell { display: grid; gap: 4px; }
.rx__n { font-size: var(--type-numeral-m-size); white-space: nowrap; }
.rx__n small { font-size: var(--font-size-21); color: var(--color-text-muted); margin-left: 3px; }
.rx__w { font-size: var(--font-size-21); line-height: 1.05; font-weight: 800; font-stretch: var(--font-width-display); padding-top: 4px; }
.rx__u { font-size: 13px; font-weight: 600; color: var(--color-text-muted); }
.rx__facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: var(--type-meta-size); color: var(--color-text-muted); }
.rx__facts b { color: var(--color-text); }
.howrow { display: grid; grid-template-columns: 56px 1fr 24px; align-items: center; gap: 14px; width: 100%; min-height: 80px; padding: 11px 14px 11px 12px; border-radius: var(--radius-lg); border: var(--border-hairline) solid var(--color-line); background: var(--color-surface); box-shadow: var(--elevation-1); text-align: left; }
.howrow b { display: block; font-size: var(--font-size-18); font-weight: 700; font-stretch: var(--font-width-title); line-height: 1.2; }
.howrow small { display: block; margin-top: 2px; font-size: 14px; color: var(--color-text-muted); line-height: 1.35; }
.howrow > .i { color: var(--color-text-muted); }
.xd-kicker { display: flex; gap: 8px; align-items: center; font-size: var(--type-meta-size); font-weight: 600; color: var(--color-text-muted); }
.xd-kicker .i { width: 18px; height: 18px; }
.readout { display: flex; align-items: flex-end; gap: 10px; }
.readout .num { font-size: var(--font-size-60); }
.readout span:last-child { font-size: var(--font-size-18); font-weight: 600; color: var(--color-text-muted); padding-bottom: 6px; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); padding: 0 8px 34px; border-top: var(--border-hairline) solid var(--color-line); }
.tab { display: grid; justify-items: center; align-content: center; gap: 4px; min-height: 64px; color: var(--color-text-subtle); font-size: 13px; font-weight: 600; font-stretch: var(--font-width-label); }
.tab__icon { display: grid; place-items: center; width: 56px; height: 30px; border-radius: var(--radius-pill); }
.tab.is-current { color: var(--color-text); font-weight: 700; }
.tab.is-current .tab__icon { background: var(--color-surface-inverse); color: var(--color-on-inverse); }
.sec-title { font-size: var(--type-headline-size); font-weight: 700; font-stretch: var(--font-width-title); }
/* rest next card with the 72 tile */
.ra-next { display: grid; grid-template-columns: 1fr 72px; column-gap: 14px; align-items: start; padding: 18px 18px 20px 20px; border-radius: var(--radius-lg); background: var(--color-rest-surface); color: var(--color-on-rest-surface); text-align: left; width: 100%; }
.ra-next:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--color-rest-bg), 0 0 0 4px var(--color-on-rest); }
.ra-next__text { display: grid; gap: 6px; min-width: 0; }
.ra-next__label { font-size: var(--font-size-16); font-weight: 600; color: var(--palette-graphite-300); }
.ra-next__name { font-size: var(--font-size-36); line-height: var(--line-height-display); font-weight: 800; font-stretch: var(--font-width-display); text-wrap: balance; }
.ra-next__rx { font-size: var(--font-size-36); color: var(--color-accent); }
.ra-next .thumb { grid-column: 2; grid-row: 1; }

/* ---------- specimen boards ---------- */
.board { display: grid; gap: 14px; }
.board__row { display: grid; grid-template-columns: 170px repeat(3, 350px); gap: 18px; align-items: end; }
.board__row > span { font-size: 14px; font-weight: 600; color: var(--color-text-muted); align-self: center; }
.board__head { font-size: 13px; font-weight: 700; color: var(--color-text-muted); }
.spec { position: relative; width: 350px; }
.spec .slot { flex: none; }
.board--thumbs .board__row { grid-template-columns: 170px repeat(4, 120px); align-items: center; }
.board--thumbs .cell { display: grid; place-items: center start; }
.inkwell { display: grid; place-items: center; width: 104px; height: 96px; border-radius: var(--radius-lg); background: var(--color-rest-surface); }
.tokens { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.tokcol { border-radius: var(--radius-lg); padding: 16px; display: grid; gap: 8px; align-content: start; }
.tokcol h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.tokrow { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.tokrow i { width: 28px; height: 28px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgb(127 127 127 / 0.35); }
.tokrow code { font-size: 12.5px; }
.tokrow b { font-variant-numeric: tabular-nums; }
</style>

    return '<div class="ctxbar"><button class="icon-btn" type="button" aria-label="Retour">' + ic('back') + '</button><div class="ctxbar__titles"><span class="ctxbar__title">' + L('Tests max', 'Max tests') + '</span></div></div><div class="scroll"><div class="page"><h1 class="t-display">' + L('Tests max', 'Max tests') + '</h1></div></div>' + tabbar(2);
  }

  /* ---------- sections ---------- */
  function build() {
  var html = '';
  html += '<section class="mock-sec" id="s-slot"><h2>' + L('Le créneau avec la figure', 'The slot with a figure') + '</h2><p>' + L('Le créneau garde sa place et sa taille. Il devient un seul bouton qui ouvre Comment faire. La figure se cadre dans ce qui reste une fois la puce pourquoi et la consigne placées, jamais dessous.', 'The slot keeps its place and size. It becomes one button that opens the how-to. The figure is framed in what is left once the why chip and the cue are placed, never under them.') + '</p></section>';
  html += shot('f1', pushUpSet(), 'Grand écran : la figure, la consigne sous le sol, la marque d’agrandissement', 'Tall screen: the figure, the cue under the floor, the enlarge mark');
  html += shot('f2', gobletSet(), 'Puce pourquoi en haut : la figure se cadre dessous, la consigne reste', 'Why chip at the top: the figure is framed below it, the cue stays');
  html += shot('f3', raiseShort(), 'Petit écran, superset : le créneau à 96 px garde la figure seule', 'Short screen, superset: the slot at 96 px keeps the figure alone', { short: true });
  html += shot('f4', gobletShort(), 'Petit écran avec la puce : la puce à gauche, la figure à droite', 'Short screen with the chip: chip on the left, figure on the right', { short: true });
  html += shot('f5', lungeSide2(), 'Côté droit : la figure en miroir et le côté rappelé dans le créneau', 'Right side: the figure mirrored and the side repeated in the slot');
  html += shot('f6', holdRunning(), 'Gainage en cours : une position tenue, donc une image fixe', 'Hold running: a held position, so a still image');
  html += shot('f7', intervalRecovery(), 'Récup d’intervalle sur jaune : figure à l’encre, immobile pendant la récup', 'Interval recovery on yellow: ink figure, still during recovery', { rest: true });

  // states board
  var H = [96, 160, 260];
  function boardRow(labelFr, labelEn, o) {
    var r = '<div class="board__row"><span>' + L(labelFr, labelEn) + '</span>';
    for (var i = 0; i < H.length; i++) { var oo = Object.assign({ h: H[i] }, o); r += '<div class="spec">' + slot(oo) + '</div>'; }
    return r + '</div>';
  }
  html += '<section class="mock-sec" id="s-states"><h2>' + L('États du créneau', 'Slot states') + '</h2><p>' + L('À 96, 160 et 260 px de haut, la largeur d’un téléphone de 390 px. Sous 200 px la consigne s’efface (elle reste dans Comment faire)&#8239;; sous 140 px la puce pourquoi passe à gauche.', 'At 96, 160 and 260 px tall, the width of a 390 px phone. Under 200 px the cue drops (it stays in the how-to); under 140 px the why chip moves to the left.') + '</p></section>';
  html += '<div class="mock-wide board"><div class="board__row"><span></span><span class="board__head">96 px</span><span class="board__head">160 px</span><span class="board__head">260 px</span></div>' +
    boardRow('En mouvement', 'Moving', { ex: 'push-up' }) +
    boardRow('Avec la puce pourquoi', 'With the why chip', { ex: 'goblet-squat', why: ['Nouvelle charge' + NB + ': comment c’était' + NB + '?', 'New weight: how did it feel?'] }) +
    boardRow('Mouvement réduit (pose clé)', 'Reduced motion (key pose)', { ex: 'goblet-squat', state: 'still', mode: 'still' }) +
    boardRow('Chargement', 'Loading', { ex: 'goblet-squat', state: 'loading' }) +
    boardRow('Figure indisponible', 'Figure unavailable', { ex: 'goblet-squat', state: 'none' }) +
    '</div>';

  html += '<section class="mock-sec" id="s-howto"><h2>' + L('Comment faire', 'How-to sheet') + '</h2><p>' + L('Grande figure en boucle, la consigne clé, les étapes numérotées. Le chrono continue dessous&#8239;; pendant un repos, une bande jaune en haut de la fiche garde le compte à rebours et la fiche se ferme seule à la fin du repos.', 'Large looping figure, the key cue, numbered steps. The clock keeps running underneath; during a rest, a yellow band at the top of the sheet keeps the countdown, and the sheet closes itself when the rest ends.') + '</p></section>';
  html += shot('f8', pushUpSet(howto({ ex: 'push-up', controls: 'paced' })), 'Depuis la série, tempo lancé : la figure suit le tempo, la série attend', 'From the set, pacing on: the figure follows the tempo, the set waits');
  html += shot('f9', restScreen(howto({ ex: 'goblet-squat', band: 38, bandPct: 42 })), 'Pendant le repos, ouverte depuis Ensuite : la bande garde le compte à rebours', 'During the rest, opened from Next up: the band keeps the countdown', { rest: true });
  html += shot('f10', picker(howto({ ex: 'door-towel-row', scroll: 1, foot: '<button class="btn btn--primary btn--block btn--player" type="button">' + L('Ajouter au bloc principal', 'Add to the main work') + '</button><button class="btn btn--secondary btn--block" type="button">' + L('Fermer', 'Close') + '</button>' })), 'Depuis le sélecteur, une longue entrée : les étapes défilent, la figure reste, le pied reprend l’action du sélecteur', 'From the picker, a long entry: the steps scroll, the figure stays, the footer repeats the picker’s action');
  html += shot('f11', session() + howto({ ex: 'lateral-lunge', controls: 'reduced' }), 'Mouvement réduit : la pose clé, et l’animation seulement si tu la lances', 'Reduced motion: the key pose, and the animation only if you start it');

  html += '<section class="mock-sec" id="s-entries"><h2>' + L('Où Comment faire s’ouvre', 'Where the how-to opens') + '</h2><p>' + L('Partout où une ligne a déjà son action, Comment faire s’ouvre depuis l’image&#8239;: une cible séparée, et la fiche reprend l’action de la ligne dans son pied.', 'Wherever a row already has its own action, the how-to opens from the picture: a separate target, and the sheet repeats the row’s action in its footer.') + '</p></section>';
  html += shot('f12', session(), 'Détail de séance : image et nom ouvrent Comment faire, le ? reste le pourquoi', 'Session detail: picture and name open the how-to, the ? stays the why');
  html += shot('f13', picker(), 'Sélecteur : l’image ouvre Comment faire, le reste de la ligne choisit', 'Picker: the picture opens the how-to, the rest of the row picks');
  html += shot('f14', exerciseProgress(), 'Progrès d’un exercice : une ligne Comment faire sous le titre', 'Exercise progress: a How to do it row under the title');
  html += shot('f15', restScreen(), 'Repos : la carte Ensuite montre la pose clé et ouvre Comment faire', 'Rest: the Next up card shows the key pose and opens the how-to', { rest: true });
  html += shot('f16', testsScreen() + howto({ ex: 'push-up', view: true, foot: '<button class="btn btn--primary btn--block btn--player" type="button">' + L('Choisir cet exercice', 'Pick this exercise') + '</button>' }), 'Tester maintenant : Comment faire remplace la liste dans la même fiche, Choisir revient au choix', 'Test now: the how-to replaces the list inside the same sheet; Pick returns to the choice');

  // thumbs board
  html += '<section class="mock-sec" id="s-thumbs"><h2>' + L('Vignettes', 'Thumbnails') + '</h2><p>' + L('Toujours la pose clé, immobile. Règle de cadrage&#8239;: une pose au moins deux fois plus large que haute (mouvements au sol) est agrandie jusqu’à remplir la hauteur, en gardant au moins 55&#8239;% de sa largeur&#8239;; le bout opposé à la tête sort du cadre.', 'Always the key pose, still. Framing rule: a pose at least twice as wide as tall (floor moves) is enlarged to fill the height, keeping at least 55% of its width; the end away from the head leaves the frame.') + '</p></section>';
  var tids = ['push-up', 'goblet-squat', 'dumbbell-lateral-raise', 'lateral-lunge', 'door-towel-row', 'deep-squat-hold'];
  var tb = '<div class="mock-wide board board--thumbs"><div class="board__row"><span></span><span class="board__head">' + L('56, cadrage du test', '56, test framing') + '</span><span class="board__head">' + L('56, règle', '56, rule') + '</span><span class="board__head">' + L('72, règle', '72, rule') + '</span><span class="board__head">' + L('72 sur la carte encre', '72 on the ink card') + '</span></div>';
  for (var k = 0; k < tids.length; k++) {
    var id = tids[k];
    tb += '<div class="board__row"><span>' + nm(id) + '</span>' +
      '<span class="cell"><span class="thumb">' + fig({ ex: id, mode: 'still' }) + '</span></span>' +
      '<span class="cell"><span class="thumb">' + fig({ ex: id, mode: 'still', tile: true }) + '</span></span>' +
      '<span class="cell"><span class="thumb thumb--72">' + fig({ ex: id, mode: 'still', tile: true }) + '</span></span>' +
      '<span class="cell"><span class="inkwell" data-figure-tone="ink"><span class="thumb thumb--72 thumb--ink">' + fig({ ex: id, mode: 'still', tile: true }) + '</span></span></span></div>';
  }
  html += tb + '</div>';

  // tokens
  function tok(rows, bg, fg, titleFr, titleEn) {
    var h = '<div class="tokcol" style="background:' + bg + ';color:' + fg + '"><h3>' + L(titleFr, titleEn) + '</h3>';
    for (var i = 0; i < rows.length; i++) h += '<div class="tokrow"><i style="background:' + rows[i][1] + '"></i><code>' + rows[i][0] + '</code><b>' + rows[i][2] + '</b></div>';
    return h + '</div>';
  }
  html += '<section class="mock-sec" id="s-tokens"><h2>' + L('Jetons de la figure', 'Figure tokens') + '</h2><p>' + L('Une échelle de contraste&#8239;: membre qui travaille, corps, membre qui travaille côté loin, côté loin. Chaque marche est à 3:1 au moins sur le fond du créneau. Jamais de jaune sur la figure.', 'One contrast ladder: working limb, body, far-side working limb, far side. Every step is at least 3:1 on the slot. Never yellow on the figure.') + '</p></section>';
  html += '<div class="mock-wide tokens">' +
    tok([['--figure-limb', '#f3f4f6', '14.1'], ['--figure-body', '#aab0bd', '7.1'], ['--figure-limb-far', '#9197a6', '5.3'], ['--figure-far', '#6a7080', '3.1'], ['--figure-prop', '#9197a6', '5.3'], ['--figure-prop-far', '#6a7080', '3.1'], ['--figure-cut', '#20242e', '—']], '#20242e', '#f3f4f6', 'Sombre, sur surface-raised', 'Dark, on surface-raised') +
    tok([['--figure-limb', '#333845', '11.7'], ['--figure-body', '#5e6474', '5.9'], ['--figure-limb-far', '#727888', '4.4'], ['--figure-far', '#848a99', '3.5'], ['--figure-prop', '#727888', '4.4'], ['--figure-prop-far', '#848a99', '3.5'], ['--figure-cut', '#ffffff', '—']], '#ffffff', '#12141a', 'Clair, sur blanc', 'Light, on white') +
    tok([['--figure-limb', '#12141a', '11.9'], ['--figure-body', '#4d3d05', '6.8'], ['--figure-limb-far', '#6e4c00', '5.0'], ['--figure-far', '#8a6a10', '3.3'], ['--figure-prop', '#6e4c00', '5.0'], ['--figure-prop-far', '#8a6a10', '3.3'], ['--figure-cut', '#ffc81e', '—']], '#ffc81e', '#12141a', 'Sur jaune (data-figure-tone="rest")', 'On yellow (data-figure-tone="rest")') +
    '</div>';

  document.getElementById('stage').innerHTML = html;
  }

  /* ---------- figures ---------- */
  function mountAll() {
    Fig.unmountAll(document.body);
    document.querySelectorAll('.fgm').forEach(function (el) {
      var o = JSON.parse(el.dataset.fig);
      var reduced = motion === 'reduced';
      var still = o.mode === 'still' || o.mode === 'still-loop' || reduced || !!o.force;
      // A figure that never moves fills its frame; one that alternates with motion keeps the loop's framing.
      var loopFrame = o.mode === 'still-loop' && !o.tile;
      var slotEl = el.closest('.slot');
      var box = null;
      if (slotEl) {
        var W = slotEl.clientWidth, Hh = slotEl.clientHeight, top = 0, bottom = 0, left = 0, right = 0;
        slotEl.querySelectorAll('[data-reserve]').forEach(function (r) {
          if (getComputedStyle(r).display === 'none') return;
          var side = r.dataset.reserve;
          if (r.classList.contains('why') && Hh < 140) side = 'left';
          if (side === 'top') top = Math.max(top, r.offsetTop + r.offsetHeight);
          if (side === 'bottom') bottom = Math.max(bottom, Hh - r.offsetTop + 2);
          if (side === 'left') left = Math.max(left, r.offsetLeft + r.offsetWidth);
          if (side === 'right' && Hh < 200) right = Math.max(right, W - r.offsetLeft);
        });
        box = [left, top, W - left - right, Hh - top - bottom];
      }
      Fig.mount(el, {
        ex: o.ex, side: o.side,
        mode: still ? 'still' : 'loop',
        tile: !!o.tile,
        box: box,
        floor: true,
        loopFrame: loopFrame
      });
    });
  }
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-set-lang]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.setLang === lang)); });
  }
  function applyTheme() {
    document.documentElement.dataset.theme = theme;
    document.querySelectorAll('[data-set-theme]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.setTheme === theme)); });
  }
  function applyMotion() {
    document.querySelectorAll('[data-set-motion]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.setMotion === motion)); });
  }
  function scrollSet() { document.querySelectorAll('[data-scroll]').forEach(function (s) { s.scrollTop = +s.dataset.scroll ? s.scrollHeight : 0; }); }
  document.addEventListener('click', function (e) {
    var l = e.target.closest('[data-set-lang]'); if (l) { lang = l.dataset.setLang; applyLang(); build(); requestAnimationFrame(function () { mountAll(); scrollSet(); }); return; }
    var t = e.target.closest('[data-set-theme]'); if (t) { theme = t.dataset.setTheme; applyTheme(); return; }
    var m = e.target.closest('[data-set-motion]'); if (m) { motion = m.dataset.setMotion; applyMotion(); mountAll(); return; }
  });
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) motion = 'reduced';
  applyTheme(); applyLang(); applyMotion(); build();
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () { requestAnimationFrame(function () { mountAll(); scrollSet(); }); });
})();
</script>
