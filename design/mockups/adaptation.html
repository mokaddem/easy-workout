<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adaptation : prochaine fois, choix, objectifs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<link rel="stylesheet" href="../../src/ui/tokens.css">
<style>
/* ================================================================
   Mockup shell (outside the phone)
   ================================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font-sans); font-stretch: var(--font-width-text);
  font-size: var(--type-body-size); line-height: var(--type-body-line);
  color: var(--color-text);
  background: color-mix(in srgb, var(--color-bg) 88%, var(--color-text));
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, p, ul, ol, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }
svg.i { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i--sm { width: 20px; height: 20px; }
svg.i--xs { width: 16px; height: 16px; }
svg.i--fill { fill: currentColor; stroke: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.mock-bar { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 24px; background: color-mix(in srgb, var(--color-bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--color-line); font-size: 14px; }
.mock-bar__title { font-weight: 700; font-stretch: var(--font-width-title); font-size: 18px; margin-right: auto; }
.mock-toggle { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--radius-pill); background: var(--color-surface-sunken); }
.mock-toggle button { min-height: 32px; padding: 0 14px; border-radius: var(--radius-pill); font-weight: 600; font-size: 14px; color: var(--color-text-muted); }
.mock-toggle button[aria-pressed="true"] { background: var(--color-surface-inverse); color: var(--color-on-inverse); }
.mock-toggle button:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.mock-group { width: 100%; max-width: 1400px; padding: 0 8px; font-size: 18px; font-weight: 700; font-stretch: var(--font-width-title); color: var(--color-text-muted); }
.mock-stage { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 40px; padding: 32px 24px 64px; }
.mock-shot { display: flex; flex-direction: column; gap: 14px; align-items: center; }
.mock-shot figcaption { max-width: var(--dev-w, 390px); font-size: 15px; font-weight: 600; color: var(--color-text-muted); text-align: center; text-wrap: balance; }

/* The phone. ?w= and ?h= resize every frame (360–430 checks). */
.device { position: relative; width: var(--dev-w, 390px); height: var(--dev-h, 844px); flex: none; display: flex; flex-direction: column; border-radius: 48px; overflow: hidden; isolation: isolate; background: var(--color-bg); color: var(--color-text); box-shadow: 0 0 0 1px var(--color-line), 0 24px 80px rgb(0 0 0 / 0.28); }
@media (max-width: 440px) { .mock-stage { padding: 16px 0 48px; gap: 32px; } .mock-bar { padding: 10px 16px; } .device { border-radius: 0; box-shadow: none; } }
.statusbar { height: 47px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 4px 30px 0 40px; font-size: 16px; font-weight: 600; letter-spacing: 0.01em; color: var(--color-text); }
.statusbar__icons { display: flex; gap: 6px; align-items: center; }
.statusbar__icons svg { height: 12px; fill: currentColor; }
.homebar { position: absolute; z-index: 60; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: currentColor; opacity: 0.85; pointer-events: none; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }

/* ================================================================
   Existing system pieces (as in the earlier mockups)
   ================================================================ */
.num { font-stretch: var(--type-numeral-width); font-weight: var(--type-numeral-weight); font-variant-numeric: tabular-nums lining-nums; letter-spacing: var(--type-numeral-tracking); line-height: var(--type-numeral-line); }
.t-display { font-size: var(--type-display-size); line-height: var(--type-display-line); font-weight: var(--type-display-weight); font-stretch: var(--type-display-width); letter-spacing: var(--letter-spacing-display); }
.t-exercise { font-size: var(--type-exercise-size); line-height: var(--type-exercise-line); font-weight: var(--type-exercise-weight); font-stretch: var(--type-exercise-width); letter-spacing: var(--letter-spacing-display); text-wrap: balance; }
.t-headline { font-size: var(--type-headline-size); line-height: var(--type-title-line); font-weight: var(--type-title-weight); font-stretch: var(--type-title-width); }
.t-meta { font-size: var(--type-meta-size); line-height: 1.4; }
.t-body { font-size: var(--type-body-size); line-height: var(--type-body-line); }
.muted { color: var(--color-text-muted); }
.section-title { font-size: var(--type-headline-size); line-height: var(--type-title-line); font-weight: var(--type-title-weight); font-stretch: var(--type-title-width); }

.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: var(--tap-comfort); padding: 0 var(--space-6); border-radius: var(--radius-md); border: var(--border-control) solid transparent; font-size: var(--type-label-size); line-height: var(--type-label-line); font-weight: var(--type-label-weight); font-stretch: var(--type-label-width); transition: transform var(--duration-instant) var(--ease-snap), background-color var(--duration-fast) var(--ease-move); }
.btn:active { transform: scale(var(--motion-scale-press)); }
.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.btn--primary { background: var(--color-accent); color: var(--color-on-accent); }
.btn--primary:active { background: var(--color-accent-pressed); }
.btn--secondary { border-color: var(--color-line-strong); color: var(--color-text); }
.btn--secondary:active { background: var(--color-press-overlay); }
.btn--ghost { color: var(--color-text); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; padding: 0 var(--space-3); min-height: var(--tap-min); }
.btn--block { width: 100%; }
.btn--player { min-height: var(--tap-player); font-size: var(--font-size-21); }
.btn--sm { min-height: var(--tap-min); padding: 0 16px; font-size: var(--type-label-size-sm); }
.icon-btn { display: inline-grid; place-items: center; width: var(--tap-min); height: var(--tap-min); border-radius: var(--radius-md); color: var(--color-text); flex: none; }
.icon-btn:active { background: var(--color-press-overlay); }
.icon-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.icon-btn--player { width: var(--tap-player); height: var(--tap-player); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: var(--radius-md); background: var(--color-surface-sunken); }
.seg__opt { min-height: var(--tap-min); border-radius: 10px; font-weight: 700; font-stretch: var(--font-width-label); font-size: var(--type-label-size-sm); color: var(--color-text-muted); }
.seg__opt[aria-checked="true"] { background: var(--color-surface-inverse); color: var(--color-on-inverse); }
.seg__opt:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.card { background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--elevation-1); border: var(--border-hairline) solid var(--color-line); }
.segs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.segs > i { height: 6px; border-radius: var(--radius-xs); background: var(--color-track); }
.segs > i.done { background: var(--color-text-subtle); }
.segs > i.cur { background: var(--color-accent-line); }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius-md); background: var(--color-surface-sunken); font-size: var(--type-meta-size); line-height: 1.4; }
.notice .i { width: 20px; height: 20px; color: var(--color-text-muted); margin-top: 1px; }
.notice b { font-weight: 700; }
.icon-well { width: 48px; height: 48px; flex: none; display: grid; place-items: center; border-radius: var(--radius-sm); background: var(--color-surface-sunken); color: var(--color-text); }
.facts { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.facts li { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 15px; }
.facts .i { width: 20px; height: 20px; color: var(--color-text-muted); }

/* tab bar, app bars, docks */
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); padding: 0 8px 34px; background: var(--color-bg); border-top: var(--border-hairline) solid var(--color-line); }
.tab { display: grid; justify-items: center; align-content: center; gap: 4px; min-height: 64px; color: var(--color-text-subtle); font-size: 13px; font-weight: 600; font-stretch: var(--font-width-label); text-align: center; line-height: 1.1; }
.tab__icon { display: grid; place-items: center; width: 56px; height: 30px; border-radius: var(--radius-pill); }
.tab.is-current { color: var(--color-text); font-weight: 700; }
.tab.is-current .tab__icon { background: var(--color-surface-inverse); color: var(--color-on-inverse); }
.appbar { display: flex; align-items: center; gap: 12px; padding: 6px 12px 6px var(--layout-gutter); flex: none; min-height: 56px; }
.appbar__text { flex: 1; min-width: 0; display: grid; }
.appbar__title { font-size: var(--font-size-21); }
.appbar--nav { padding-left: 4px; gap: 4px; }
.ctxbar { flex: none; display: flex; align-items: center; min-height: 56px; padding: 4px var(--layout-gutter); }
.ctxbar__line { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; color: var(--color-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock { flex: none; position: relative; z-index: var(--z-sticky); display: grid; gap: 12px; padding: 12px 16px 42px; background: var(--color-bg); border-top: var(--border-hairline) solid var(--color-line); }
.dock-bar { flex: none; display: flex; gap: 10px; padding: 12px 16px; background: var(--color-bg); box-shadow: var(--elevation-2); position: relative; z-index: var(--z-sticky); }
.dock-bar .btn { flex: 1; }

/* sheets and dialogs */
.scrim { position: absolute; inset: 0; z-index: var(--z-sheet); background: var(--color-scrim); }
.scrim--center { display: flex; align-items: center; padding: 0 16px; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: calc(var(--z-sheet) + 1); max-height: calc(100% - 64px); display: flex; flex-direction: column; border-radius: var(--radius-xl) var(--radius-xl) 0 0; background: var(--color-surface-raised); box-shadow: var(--elevation-3); }
.sheet__grab { align-self: center; flex: none; width: 40px; height: 5px; margin: 10px 0 6px; border-radius: 3px; background: var(--color-line-strong); }
.sheet__body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 8px var(--layout-gutter) 20px; display: grid; gap: 4px; align-content: start; }
.sheet__body::-webkit-scrollbar { display: none; }
.sheet__head { display: grid; gap: 8px; padding-bottom: 8px; }
.sheet__title { font-size: var(--font-size-36); line-height: var(--line-height-display); font-weight: 800; font-stretch: var(--font-width-display); text-wrap: balance; }
.sheet__foot { flex: none; display: grid; gap: 8px; padding: 12px 16px 42px; border-top: var(--border-hairline) solid var(--color-line); }
.dialog { width: 100%; display: grid; gap: 20px; padding: 24px 20px 20px; border-radius: var(--radius-xl); background: var(--color-surface-raised); box-shadow: var(--elevation-3); }
.dialog__text { display: grid; gap: 10px; }
.dialog__title { font-size: var(--font-size-24); }
.dialog__actions { display: grid; gap: 8px; }
.dialog__actions .btn { padding: 0 16px; }

/* ---------- summary (as built) ---------- */
.sum { padding: 4px var(--layout-gutter) 32px; display: grid; gap: 32px; }
.sum__head { display: grid; gap: 22px; }
.sum__title { font-size: var(--font-size-48); text-wrap: balance; }
.dur { display: grid; gap: 10px; }
.dur__row { display: flex; align-items: flex-end; gap: 10px; }
.dur__n { font-size: var(--font-size-144); line-height: 0.74; margin-left: -6px; }
.dur__u { font-size: var(--font-size-48); color: var(--color-text-muted); line-height: 0.8; }
.dur__label { font-size: 15px; font-weight: 600; color: var(--color-text-muted); line-height: 1.3; }
.strip { display: flex; gap: 7px; }
.strip__g { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; }
.strip i { height: 10px; border-radius: 2px; background: var(--color-track); }
.strip i.on { background: var(--color-text); }
.stats { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; }
.stat { display: grid; gap: 6px; align-content: start; }
.stat__n { display: flex; align-items: baseline; gap: 4px; font-size: var(--font-size-60); white-space: nowrap; }
.stat__n .of, .stat__n .u { font-size: var(--font-size-36); color: var(--color-text-muted); }
.stat__label { font-size: 15px; font-weight: 600; color: var(--color-text-muted); line-height: 1.3; }
.sw-card { overflow: hidden; }
.swrow { position: relative; width: 100%; display: flex; align-items: center; gap: 16px; min-height: 76px; padding: 16px 16px 16px 18px; text-align: left; }
.swrow:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--color-focus); }
.swrow__text { flex: 1; min-width: 0; display: grid; gap: 3px; }
.swrow__title { font-size: var(--font-size-18); font-weight: 700; font-stretch: var(--font-width-title); line-height: 1.3; }
.swrow__meta { font-size: 15px; line-height: 1.4; color: var(--color-text-muted); }
.switch { position: relative; flex: none; width: 52px; height: 32px; border-radius: var(--radius-pill); background: var(--color-surface-inverse); border: var(--border-strong) solid var(--color-surface-inverse); }
.switch::after { content: ""; position: absolute; top: 50%; left: 4px; width: 22px; height: 22px; margin-top: -11px; border-radius: 50%; transform: translateX(19px); background: var(--color-on-inverse); }
.sum-sec { display: grid; gap: 12px; }
.sum-sec__head { display: grid; gap: 4px; }
.bline { display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 14px; border-radius: var(--radius-md); background: var(--color-surface-sunken); }
.bline > .i { width: 20px; height: 20px; color: var(--color-text-muted); }
.bline__text { flex: 1; min-width: 0; font-size: 14px; line-height: 1.35; }
.bline .btn { min-height: var(--tap-min); padding: 0 16px; font-size: var(--type-label-size-sm); background: var(--color-surface); }
.exlist { display: grid; }
.ex { display: grid; gap: 3px; padding: 12px 0; border-top: var(--border-hairline) solid var(--color-line); }
.ex:first-child { border-top: 0; padding-top: 0; }
.ex__name { font-size: 17px; font-weight: 600; line-height: 1.3; }
.ex__meta { font-size: 14px; color: var(--color-text-muted); line-height: 1.4; }
.ex__meta b { color: var(--color-text); font-weight: 700; }
.dock--player .btn { min-height: var(--tap-player); font-size: var(--font-size-21); }

/* ---------- programme tab (as built) ---------- */
.hero { padding: 20px var(--layout-gutter) 0; display: grid; gap: 14px; }
.hero__week { display: grid; gap: 8px; }
.hero__label { font-size: var(--font-size-18); font-weight: 600; color: var(--color-text-muted); line-height: 1; }
.hero__row { display: flex; align-items: flex-end; gap: 12px; }
.hero__n { font-size: var(--font-size-144); line-height: 0.74; margin-left: -6px; }
.hero__of { font-size: var(--font-size-48); color: var(--color-text-muted); line-height: 0.8; }
.hero__phase { display: grid; gap: 6px; padding-top: 6px; }
.hero__phase .t-display { font-size: var(--font-size-36); }
.hero .segs > i { height: 8px; }
.next { margin: 16px 16px 0; padding: 20px; display: grid; gap: 16px; }
.next__label { font-weight: 600; color: var(--color-text-muted); }
.next__title { font-size: var(--font-size-36); }
.next__muscles { color: var(--color-text-muted); margin-top: 6px; }
.next .btn--ghost { justify-self: center; }
.nudge { margin: 16px 16px 0; display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 12px 8px 12px 14px; text-align: left; width: calc(100% - 32px); }
.nudge:active { background: var(--color-press-overlay); }
.nudge:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.nudge__text { flex: 1; min-width: 0; display: grid; gap: 2px; }
.nudge__title { font-size: var(--font-size-16); font-weight: 700; line-height: 1.3; }
.nudge__sub { font-size: var(--type-meta-size); color: var(--color-text-muted); line-height: 1.35; }
.nudge > .i { color: var(--color-text-muted); }
.nudge + .next { margin-top: 12px; }
.next + .nudge { margin-top: 12px; }

/* ---------- session detail (as built) ---------- */
.sd-head { padding: 4px var(--layout-gutter) 0; display: grid; gap: 14px; }
.sd-id { display: grid; grid-template-columns: auto 1fr; column-gap: 14px; align-items: end; }
.sd-letter { font-size: var(--font-size-144); line-height: 0.74; margin-left: -4px; }
.sd-id__text { display: grid; gap: 6px; padding-bottom: 2px; }
.sd-sub { font-size: var(--type-body-size); color: var(--color-text-muted); line-height: 1.35; }
.sd-sec { padding: 28px var(--layout-gutter) 0; display: grid; gap: 4px; }
.sd-sec__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 4px; }
.sd-sec__meta { font-size: var(--type-meta-size); color: var(--color-text-muted); font-weight: 600; white-space: nowrap; }
.sd-sec:last-child { padding-bottom: 28px; }
.rx { display: grid; grid-template-columns: 26px 1fr 48px; column-gap: 8px; padding: 14px 0 18px; border-top: var(--border-hairline) solid var(--color-line); }
.rx:first-of-type { border-top: 0; }
.rx__idx { font-size: var(--font-size-21); color: var(--color-text-subtle); padding-top: 5px; line-height: 1; }
.rx__name { align-self: center; font-size: var(--font-size-21); line-height: 1.12; font-weight: 700; font-stretch: var(--font-width-title); text-wrap: balance; padding: 2px 0; }
.rx__why { margin: -6px -8px 0 0; color: var(--color-text-muted); }
.rx__body { grid-column: 2 / 4; display: grid; gap: 10px; padding-top: 8px; }
.rx__nums { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px 24px; }
.rx__cell { display: grid; gap: 5px; min-width: 0; align-content: start; }
.rx__n { font-size: var(--type-numeral-m-size); white-space: nowrap; }
.rx__n small { font-size: var(--font-size-21); color: var(--color-text-muted); margin-left: 3px; letter-spacing: 0; }
.rx__w { font-size: var(--font-size-21); line-height: 1.05; font-weight: 800; font-stretch: var(--font-width-display); padding-top: 4px; }
.rx__u { font-size: 13px; font-weight: 600; color: var(--color-text-muted); line-height: 1.2; }
.rx__facts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-size: var(--type-meta-size); line-height: 1.3; color: var(--color-text-muted); }
.rx__facts b { color: var(--color-text); font-weight: 700; }
.delta { display: inline-flex; align-items: center; min-height: 24px; padding: 0 8px; border-radius: var(--radius-pill); background: var(--color-surface-inverse); color: var(--color-on-inverse); font-size: 13px; font-weight: 700; font-stretch: var(--font-width-label); white-space: nowrap; }
.whyline { display: flex; gap: 8px; align-items: flex-start; font-size: var(--type-meta-size); line-height: 1.4; color: var(--color-text); }
.whyline > .i { width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--color-text-muted); }
.whyline b { font-weight: 700; }

/* ---------- player (as built) ---------- */
.pbar { flex: none; display: flex; align-items: center; gap: 4px; padding: 4px 8px; min-height: 56px; }
.pbar__mid { flex: 1; min-width: 0; display: grid; gap: 6px; padding: 0 8px; }
.pbar__mid .t-meta { font-weight: 600; color: var(--color-text-muted); }
.pbar__clock { font-size: var(--font-size-21); color: var(--color-text-muted); padding: 0 4px; }
.pa { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 8px var(--layout-gutter) 0; gap: 16px; }
.pa-set { display: grid; gap: 8px; }
.pa-set__row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.pa-set__label { display: flex; align-items: baseline; gap: 10px; font-weight: 700; font-stretch: var(--font-width-title); font-size: var(--font-size-24); }
.pa-set__label .num { font-size: var(--font-size-48); }
.pa-set__label .of { color: var(--color-text-muted); }
.pa-set .segs > i { height: 8px; }
.sides { display: flex; gap: 6px; }
.sides > i { display: grid; place-items: center; width: 60px; height: 60px; border-radius: var(--radius-md); border: var(--border-control) solid var(--color-line-strong); font-style: normal; }
.sides > i b { font-size: var(--font-size-48); font-weight: 800; font-stretch: var(--font-width-numeral); line-height: 1; }
.sides > i.cur { background: var(--color-surface-inverse); border-color: var(--color-surface-inverse); color: var(--color-on-inverse); }
.score { display: grid; grid-template-columns: minmax(min-content, 1.45fr) minmax(min-content, 1fr); gap: 12px 20px; }
.score__cell { display: grid; gap: 6px; align-content: start; min-width: 0; }
.score__n { font-size: var(--type-numeral-xl-size); white-space: nowrap; }
.score__u { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: var(--font-size-18); font-weight: 600; color: var(--color-text-muted); line-height: 1.2; }
.score__range { white-space: nowrap; }
.score__top { display: flex; align-items: flex-start; gap: 10px; }
.score__top .badge { margin-top: 6px; }
.score__w { padding-top: 6px; font-size: var(--font-size-36); line-height: var(--line-height-display); font-weight: 800; font-stretch: var(--font-width-display); hyphens: auto; overflow-wrap: anywhere; }
.badge { display: inline-flex; align-items: center; min-height: 26px; padding: 0 9px; border-radius: var(--radius-pill); border: var(--border-control) solid var(--color-line-strong); color: var(--color-text); font-size: 14px; font-weight: 700; font-stretch: var(--font-width-label); }
.tempo { display: grid; grid-template-columns: 2fr 1fr 2fr; gap: 4px; }
.tempo--311 { grid-template-columns: 3fr 1fr 1fr; }
.tempo__seg { display: grid; align-content: center; gap: 2px; min-height: 52px; padding: 0 10px; border-radius: var(--radius-xs); background: var(--color-surface-sunken); color: var(--color-text-muted); font-weight: 700; font-stretch: var(--font-width-label); font-size: 13px; line-height: 1.1; white-space: nowrap; overflow: hidden; }
.tempo__seg b { font-size: var(--font-size-21); font-weight: 800; font-stretch: var(--font-width-title); line-height: 1; color: var(--color-text); font-variant-numeric: tabular-nums; }
.tempo__seg.is-active { background: var(--color-accent); color: var(--color-on-accent); }
.tempo__seg.is-active b { color: var(--color-on-accent); }
.anim-slot { position: relative; overflow: hidden; border-radius: var(--radius-lg); background: radial-gradient(120% 90% at 50% 38%, var(--color-surface-raised) 0%, var(--color-surface) 62%); border: var(--border-hairline) solid var(--color-line); color: var(--color-text-subtle); }
.pa .anim-slot { flex: 1; min-height: 96px; }
.anim-slot__floor { position: absolute; inset: auto 0 0 0; width: 100%; height: 46%; stroke: var(--color-line); stroke-width: 1; fill: none; }
svg.anim-slot__glyph { position: absolute; left: 50%; top: 40%; width: 76px; height: 76px; margin: -38px 0 0 -38px; stroke-width: 1.4; color: var(--color-text-subtle); opacity: 0.9; }
.anim-slot__tag { position: absolute; top: 12px; left: 12px; padding: 4px 10px; border-radius: var(--radius-pill); background: var(--color-bg); color: var(--color-text-muted); font-size: 13px; font-weight: 600; font-stretch: var(--font-width-label); }
.anim-slot__cue { position: absolute; left: 16px; right: 16px; bottom: 14px; text-align: center; color: var(--color-text-muted); font-weight: 600; font-size: 15px; line-height: 1.3; text-wrap: balance; }
.pdock { flex: none; display: grid; gap: 10px; padding: 14px 16px 42px; }
.pdock__row { display: flex; gap: 10px; }
.pdock__done { flex: 1; justify-content: flex-start; gap: 14px; padding: 0 20px; text-align: left; }
.pdock__done .i { width: 28px; height: 28px; stroke-width: 3; }
.pdock__done-text { display: grid; gap: 1px; }
.pdock__done-text small { font-size: 14px; font-weight: 600; color: var(--color-on-accent-muted); font-stretch: var(--font-width-text); }
.pdock .icon-btn--player { border: var(--border-control) solid var(--color-line-strong); }
/* New-weight check: the feel starts unpicked and asks once per set; Done still logs */
.seg--ask { box-shadow: inset 0 0 0 var(--border-control) var(--color-line-strong); }

/* ================================================================
   New in this phase
   ================================================================ */

/* ---------- Proposal card: one exercise, one question, answers that apply on tap ---------- */
.pc { display: grid; gap: 14px; padding: 16px; }
.pc__head { display: flex; gap: 14px; align-items: flex-start; }
.pc__head-text { flex: 1; min-width: 0; display: grid; gap: 2px; padding-top: 1px; }
.pc__kick { font-size: var(--type-meta-size); line-height: 1.35; color: var(--color-text-muted); }
.pc__kick b { color: var(--color-text); font-weight: 700; }
.pc__kick .pain { color: var(--color-danger-text); font-weight: 700; }
.pc__name { font-size: var(--font-size-21); line-height: 1.15; font-weight: 700; font-stretch: var(--font-width-title); text-wrap: balance; }
.well--pain { background: var(--color-danger-tint); color: var(--color-danger-text); }
.well--done { background: var(--color-complete); color: var(--color-on-complete); }
.well--count { background: var(--color-surface-inverse); color: var(--color-on-inverse); }
.well--count .num { font-size: var(--font-size-36); line-height: 1; }
.pc__answers { display: grid; gap: 8px; }
.pc__note { display: flex; gap: 10px; align-items: flex-start; font-size: var(--type-meta-size); line-height: 1.4; color: var(--color-text-muted); }
.pc__note .i { width: 20px; height: 20px; color: var(--color-text-subtle); margin-top: 0; }
.pc__note b { color: var(--color-text); font-weight: 700; }
.pc__note--now { color: var(--color-text); }
.pc__note--now .i { color: var(--color-text-muted); }
.pc__note--care { padding: 12px 14px; border-radius: var(--radius-md); background: var(--color-surface-sunken); color: var(--color-text); font-weight: 600; }
.pc__note--care .i { color: var(--color-text); }

/* Answer row: the whole row is the target; it applies at once (undo stays on the card) */
.ans { width: 100%; display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 10px 14px; border-radius: var(--radius-md); border: var(--border-control) solid var(--color-line-strong); text-align: left; transition: transform var(--duration-instant) var(--ease-snap), background-color var(--duration-fast) var(--ease-move); }
.ans:active { background: var(--color-press-overlay); transform: scale(var(--motion-scale-press)); }
.ans:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.ans > .i { color: var(--color-text-muted); }
.ans__text { flex: 1; min-width: 0; display: grid; gap: 2px; }
.ans__t { font-size: 17px; line-height: 1.25; font-weight: 700; font-stretch: var(--font-width-label); }
.ans__s { font-size: var(--type-meta-size); line-height: 1.35; color: var(--color-text-muted); }

/* Confirmed state: what was decided, in the same words as the answer */
.pc__done { display: flex; gap: 14px; align-items: flex-start; }
.pc__done-text { flex: 1; min-width: 0; display: grid; gap: 4px; }
.pc__done-title { font-size: var(--font-size-18); line-height: 1.25; font-weight: 700; font-stretch: var(--font-width-title); }
.pc__done-sub { font-size: 15px; line-height: 1.4; color: var(--color-text-muted); }
.pc__done-sub b { color: var(--color-text); font-weight: 700; }
.pc__done .btn--ghost { justify-self: start; margin-left: -12px; }
.pc.is-done { gap: 0; }

/* In a sheet the cards drop their chrome: hairlines separate them */
.pc--flat { background: none; border: 0; border-radius: 0; box-shadow: none; padding: 20px 0; border-top: var(--border-hairline) solid var(--color-line); }
.pc-list { display: grid; gap: 12px; }

/* ---------- Change ledger: one line per changed exercise, the new value as the figure ---------- */
.lg { display: grid; }
.lg__cols { display: grid; grid-template-columns: 92px 1fr; padding-bottom: 8px; font-size: 13px; font-weight: 700; font-stretch: var(--font-width-label); color: var(--color-text-muted); border-bottom: var(--border-hairline) solid var(--color-line); }
.lg__row { display: grid; grid-template-columns: 92px minmax(0, 1fr); grid-template-areas: "fig name" "fig did" "fig why"; column-gap: 14px; row-gap: 3px; padding: 14px 0; border-top: var(--border-hairline) solid var(--color-line); }
.lg__cols + .lg__row { border-top: 0; }
.lg__did { grid-area: did; font-size: var(--type-meta-size); line-height: 1.4; color: var(--color-text-muted); }
.lg__did b { color: var(--color-text); font-weight: 700; }
.lg__did .pain { color: var(--color-danger-text); font-weight: 700; }
.lg__now--same { color: var(--color-text-muted); }
.lg__name { grid-area: name; font-size: 17px; line-height: 1.3; font-weight: 600; }
.lg__why { grid-area: why; font-size: var(--type-meta-size); line-height: 1.4; color: var(--color-text); }
.lg__why b { color: var(--color-text); font-weight: 700; }
.lg__fig { grid-area: fig; display: grid; align-content: start; gap: 4px; padding-top: 1px; }
.lg__was { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; line-height: 1; color: var(--color-text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.lg__was .i { width: 14px; height: 14px; stroke-width: 2.5; }
.lg__now { font-size: var(--type-numeral-m-size); white-space: nowrap; }
.lg__now small { font-size: var(--font-size-18); color: var(--color-text-muted); margin-left: 3px; letter-spacing: 0; font-weight: 700; }
.lg__now--word { font-size: var(--font-size-24); line-height: 1; font-weight: 800; font-stretch: var(--font-width-display); }
.lg__row--hold .lg__fig { align-content: start; }
.lg__eq { width: 44px; height: 44px; display: grid; place-items: center; border-radius: var(--radius-sm); background: var(--color-surface-sunken); color: var(--color-text-muted); }

/* ---------- Goal ruler: where the goal sits inside the range ---------- */
.ruler { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; font-stretch: var(--font-width-label); color: var(--color-text-muted); font-variant-numeric: tabular-nums; line-height: 1; }
.ruler__bars { display: flex; gap: 3px; }
.ruler__bars i { width: 10px; height: 8px; border-radius: 2px; background: var(--color-track); }
.ruler__bars i.on { background: var(--color-text); }
.ruler__bars i.beyond, .ruler__bars i.below { background: transparent; box-shadow: inset 0 0 0 1.5px var(--color-line-strong); }
.ruler__bars i.beyond.on, .ruler__bars i.below.on { background: var(--color-text); box-shadow: none; }

/* ---------- Change tag: what moved since last time (outline; the inverse delta tag stays the week's change) ---------- */
.chg { display: inline-flex; align-items: center; gap: 4px; min-height: 24px; padding: 0 8px 0 6px; border-radius: var(--radius-pill); border: var(--border-control) solid var(--color-line-strong); color: var(--color-text); font-size: 13px; font-weight: 700; font-stretch: var(--font-width-label); white-space: nowrap; }
.chg .i { width: 14px; height: 14px; stroke-width: 2.5; }

/* ---------- Swap line and pending line inside a prescription row ---------- */
.swapline { display: grid; gap: 10px; padding: 12px 14px; border-radius: var(--radius-md); background: var(--color-surface-sunken); }
.swapline__text { display: flex; gap: 8px; align-items: flex-start; font-size: var(--type-meta-size); line-height: 1.4; }
.swapline__text .i { width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--color-text-muted); }
.swapline__text b { font-weight: 700; }
.swapline .btn { justify-self: start; background: var(--color-surface); }
.swapline--pain .swapline__text .i { color: var(--color-danger-text); }

/* ---------- Why chip (player): first set of a changed exercise ---------- */
.whychip { display: flex; align-items: flex-start; gap: 10px; min-height: 40px; padding: 9px 14px 9px 10px; border-radius: var(--radius-md); background: var(--color-surface-sunken); font-size: 15px; line-height: 1.3; font-weight: 600; color: var(--color-text); }
.whychip .i { width: 20px; height: 20px; color: var(--color-text-muted); margin-top: 0; }
.whychip--pain .i { color: var(--color-danger-text); }
/* On the set screen the chip sits at the top of the animation slot, in place of the pattern tag and the cue:
   it costs no height, so the floor-read numerals and the dock never move. */
.anim-slot .whychip { position: absolute; z-index: 1; top: 10px; left: 10px; right: 10px; background: var(--color-bg); box-shadow: var(--elevation-1); }

/* ---------- Summary order: decisions, then the ledger ---------- */
.sum-sec .pc-list .card { box-shadow: var(--elevation-1); }
</style>
</head>

<!-- Proposal: pain on the standing shoulder press (first time: three answers) -->
<template id="tpl-card-pain">
  <article class="card pc" data-card>
    <div class="pc__ask">
      <div class="pc__head">
        <span class="icon-well well--pain"><svg class="i"><use href="#i-stop"/></svg></span>
        <div class="pc__head-text">
          <h3 class="pc__name" data-en="Standing shoulder press">Développé militaire debout</h3>
          <p class="pc__kick" data-en="<span class=&quot;pain&quot;>Pain</span>, 1 set of 3 done. What next?"><span class="pain">Douleur</span>, 1 série sur 3 faite. Pour la suite&#8239;?</p>
        </div>
      </div>
      <div class="pc__answers" style="margin-top: 14px">
        <button class="ans" type="button" data-answer="swap">
          <svg class="i"><use href="#i-swap"/></svg>
          <span class="ans__text"><span class="ans__t" data-en="Seated shoulder press instead">Développé épaules assis à la place</span><span class="ans__s" data-en="Same movement, seated. In every session, from the next one.">Même mouvement, assis. Dans toutes tes séances, dès la prochaine.</span></span>
        </button>
        <button class="ans" type="button" data-answer="lighter">
          <svg class="i"><use href="#i-arrow-down"/></svg>
          <span class="ans__text"><span class="ans__t" data-en="Keep it, lighter">Le garder, plus léger</span><span class="ans__s" data-en="8&nbsp;kg instead of 10&nbsp;kg. No increase before 2 pain-free sessions.">8&nbsp;kg au lieu de 10&nbsp;kg. Pas de hausse avant 2 séances sans douleur.</span></span>
        </button>
        <button class="ans" type="button" data-answer="keep">
          <svg class="i"><use href="#i-equals"/></svg>
          <span class="ans__text"><span class="ans__t" data-en="Keep it as it is">Le garder tel quel</span><span class="ans__s" data-en="10&nbsp;kg, goal 10 reps. No increase before 2 pain-free sessions.">10&nbsp;kg, objectif 10 reps. Pas de hausse avant 2 séances sans douleur.</span></span>
        </button>
      </div>
      <p class="pc__note pc__note--now" style="margin-top: 14px"><svg class="i"><use href="#i-arrow-down"/></svg><span data-en="Next session: <b>8&nbsp;kg instead of 10&nbsp;kg</b> until you choose.">Prochaine séance&#8239;: <b>8&nbsp;kg au lieu de 10&nbsp;kg</b> tant que tu n’as pas choisi.</span></p>
    </div>
    <div class="pc__done" data-for="swap" hidden>

<script>
/* Mockup only: clone shared templates, fill per-frame slots, draw rulers and strips. Runs before the language pass. */
(function () {
  var params = new URLSearchParams(location.search);
  if (params.get('w')) document.documentElement.style.setProperty('--dev-w', parseInt(params.get('w'), 10) + 'px');
  if (params.get('h')) document.documentElement.style.setProperty('--dev-h', parseInt(params.get('h'), 10) + 'px');

  document.querySelectorAll('[data-include]').forEach(function (host) {
    var tpl = document.getElementById(host.dataset.include);
    var frag = tpl.content.cloneNode(true);
    var state = host.dataset.state;
    var done = host.dataset.done, sub = host.dataset.sub;
    var nodes = Array.prototype.slice.call(frag.childNodes);
    host.replaceWith(frag);
    nodes.forEach(function (n) {
      if (n.nodeType !== 1) return;
      if (state && n.matches('[data-card]')) setCard(n, state);
      if (host.dataset.ask && n.querySelector) {
        var seg = n.querySelector('.seg');
        if (seg) { seg.classList.add('seg--ask'); seg.querySelectorAll('.seg__opt').forEach(function (o) { o.setAttribute('aria-checked', 'false'); }); }
      }
      if (done) {
        var l = n.querySelector('[data-slot="done-label"]'), s = n.querySelector('[data-slot="done-sub"]');
        if (l) { l.innerHTML = done.split('|')[0]; l.setAttribute('data-en', done.split('|')[1]); }
        if (s) { s.innerHTML = sub.split('|')[0]; s.setAttribute('data-en', sub.split('|')[1]); }
      }
    });
  });

  function setCard(card, state) {
    var ask = card.querySelector('.pc__ask');
    ask.hidden = !!state;
    card.classList.toggle('is-done', !!state);
    card.querySelectorAll('.pc__done').forEach(function (d) { d.hidden = d.dataset.for !== state; });
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest('.ans[data-answer]');
    if (a) { setCard(a.closest('[data-card]'), a.dataset.answer); return; }
    var u = e.target.closest('[data-undo]');
    if (u) setCard(u.closest('[data-card]'), null);
  });

  /* Goal ruler: one bar per value in the range, filled up to the goal. Dashed bars outside the range:
     under it after a weight step (from the goal up), past it at the beyond-range stage (up to max + 4). */
  document.querySelectorAll('.ruler[data-min]').forEach(function (r) {
    var min = +r.dataset.min, max = +r.dataset.max, goal = +r.dataset.goal, step = +(r.dataset.step || 1);
    var reach = +(r.dataset.reach || 4) * step;
    var unit = r.dataset.unit ? '\u00a0' + r.dataset.unit : '';
    function bars(from, to, cls) { var o = ''; for (var v = from; v <= to; v += step) o += '<i class="' + cls + (v <= goal ? ' on' : '') + '"></i>'; return o; }
    var out = '';
    if (goal < min) out += '<span class="ruler__bars">' + bars(goal, min - step, 'below') + '</span>';
    out += '<span>' + min + '</span><span class="ruler__bars">' + bars(min, max, '') + '</span><span>' + max + unit + '</span>';
    if (goal > max) out += '<span class="ruler__bars">' + bars(max + step, max + reach, 'beyond') + '</span>';
    r.setAttribute('aria-hidden', 'true');
    r.innerHTML = out;
  });

  document.querySelectorAll('.strip[data-strip]').forEach(function (s) {
    var plan = s.dataset.strip.split(',').map(Number), dn = s.dataset.done.split(',').map(Number);
    s.innerHTML = plan.map(function (n, k) {
      var out = '<span class="strip__g" style="flex:' + n + '">';
      for (var j = 0; j < n; j++) out += '<i' + (j < dn[k] ? ' class="on"' : '') + '></i>';
      return out + '</span>';
    }).join('');
  });
})();
</script>
<script>
/* Mockup shell: phone chrome, FR/EN, dark/light, ?lang= & ?theme= */
(function () {
  var root = document.documentElement;
  var params = new URLSearchParams(location.search);
  var sysDark = window.matchMedia('(prefers-color-scheme: dark)');
  var lang = params.get('lang') === 'en' ? 'en' : 'fr';
  var theme = params.get('theme') === 'light' || params.get('theme') === 'dark' ? params.get('theme') : null;

  var STATUS = '<span>18:42</span><span class="statusbar__icons"><svg viewBox="0 0 18 12" width="18"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 16 12" width="16"><path d="M8 2.5c2.3 0 4.4.9 6 2.3l1.2-1.3A10.5 10.5 0 0 0 8 .7 10.5 10.5 0 0 0 .8 3.5L2 4.8a8.6 8.6 0 0 1 6-2.3zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.3-1.3A6.6 6.6 0 0 0 8 4.3a6.6 6.6 0 0 0-4.7 1.8l1.3 1.3c.9-.8 2.1-1.3 3.4-1.3zM8 9.6l2-2a2.9 2.9 0 0 0-4 0z"/></svg><svg viewBox="0 0 27 12" width="27"><rect x="0.5" y="0.5" width="23" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="16" height="8" rx="2"/><rect x="24.5" y="4" width="2" height="4" rx="1" opacity=".45"/></svg></span>';
  document.querySelectorAll('.device').forEach(function (d) {
    var sb = d.querySelector('.statusbar');
    if (sb && !sb.innerHTML.trim()) { sb.innerHTML = STATUS; sb.setAttribute('aria-hidden', 'true'); }
    if (!d.querySelector('.homebar')) { var h = document.createElement('div'); h.className = 'homebar'; h.setAttribute('aria-hidden', 'true'); d.appendChild(h); }
  });

  function effectiveTheme() { return theme || (sysDark.matches ? 'dark' : 'light'); }
  function formatNumber(v, decimals) {
    return new Intl.NumberFormat(lang === 'fr' ? 'fr-FR' : 'en-GB', { minimumFractionDigits: 0, maximumFractionDigits: decimals == null ? 1 : decimals }).format(v);
  }
  function sync() {
    document.querySelectorAll('[data-set-lang]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.setLang === lang)); });
    document.querySelectorAll('[data-set-theme]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.setTheme === effectiveTheme())); });
  }
  function applyLang() {
    root.lang = lang;
    document.querySelectorAll('[data-en]').forEach(function (el) {
      if (!el.hasAttribute('data-fr')) el.setAttribute('data-fr', el.innerHTML);
      el.innerHTML = lang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-fr');
    });
    document.querySelectorAll('[data-en-label]').forEach(function (el) {
      if (!el.hasAttribute('data-fr-label')) el.setAttribute('data-fr-label', el.getAttribute('aria-label') || '');
      el.setAttribute('aria-label', lang === 'en' ? el.getAttribute('data-en-label') : el.getAttribute('data-fr-label'));
    });
    document.querySelectorAll('[data-num]').forEach(function (el) { el.textContent = formatNumber(parseFloat(el.dataset.num), el.dataset.decimals ? +el.dataset.decimals : 1); });
    sync();
    placeScrolls();
  }
  function applyTheme() { if (theme) root.dataset.theme = theme; else delete root.dataset.theme; sync(); }
  function placeScrolls() {
    document.querySelectorAll('.scroll[data-scroll-to]').forEach(function (s) {
      var t = s.querySelector(s.dataset.scrollTo);
      if (!t) return;
      var off = parseFloat(s.dataset.scrollOffset || '12');
      s.scrollTop = t.getBoundingClientRect().top - s.getBoundingClientRect().top + s.scrollTop - off;
    });
  }
  window.mockPlaceScrolls = placeScrolls;
  document.addEventListener('click', function (e) {
    var l = e.target.closest('[data-set-lang]');
    if (l) { lang = l.dataset.setLang; applyLang(); return; }
    var t = e.target.closest('[data-set-theme]');
    if (t) { theme = t.dataset.setTheme; applyTheme(); return; }
    var opt = e.target.closest('.seg__opt');
    if (opt) opt.parentElement.querySelectorAll('.seg__opt').forEach(function (o) { o.setAttribute('aria-checked', String(o === opt)); });
  });
  sysDark.addEventListener('change', sync);
  applyTheme();
  applyLang();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeScrolls);
})();
</script>
</body>
